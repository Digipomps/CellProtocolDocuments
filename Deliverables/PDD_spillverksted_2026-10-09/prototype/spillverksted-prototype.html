<title>Spillverksted prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Workshop bench: chat on the left, the running game as the big centre object, project and library as side drawers. */
:root{
  --bg:#e9eef0; --panel:#fbfdfd; --ink:#17232b; --mute:#5b6b74; --line:#cfd9dd;
  --accent:#e8590c; --accent-ink:#fff; --soft:#dff1f5; --me:#ffe8d6;
  --stage:#14213d; --stage-ink:#dbe4ff; --code:#0e1726; --code-ink:#d6e2ff; --code-hl:#24406e; --code-err:#5a2323;
  --ok:#1f8a4c; --warn:#b54708; --err:#c0362c; --err-bg:#fff1ef;
  --display:"Baloo 2",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f171c; --panel:#162229; --ink:#e4edf0; --mute:#97a8b0; --line:#2a3a43;
  --accent:#ff7b2e; --accent-ink:#1a0d04; --soft:#173740; --me:#3a2616;
  --stage:#0a1226; --code:#081019; --err-bg:#3a1a17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171c; --panel:#162229; --ink:#e4edf0; --mute:#97a8b0; --line:#2a3a43;
  --accent:#ff7b2e; --accent-ink:#1a0d04; --soft:#173740; --me:#3a2616;
  --stage:#0a1226; --code:#081019; --err-bg:#3a1a17; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-inline:16px}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:12px}
.brand{font:800 26px/1 var(--display);letter-spacing:.01em;margin:0}
.brand span{color:var(--accent)}
#pname{border:1px dashed transparent;background:transparent;color:var(--ink);font:600 16px var(--body);padding:3px 6px;border-radius:6px;min-width:0;width:14em}
#pname:hover,#pname:focus{border-color:var(--line);background:var(--panel)}
.levels{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mute)}
.levels i{width:26px;height:10px;border-radius:5px;background:var(--line);display:block}
.levels i.on{background:var(--accent)}
main{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr) minmax(240px,300px);gap:14px;padding-block:0 16px;height:calc(100% - 64px)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.panel>h2{margin:0;padding:10px 14px;font:800 17px/1.2 var(--display);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
.panel>h2 small{margin-left:auto;font:400 13px var(--body);color:var(--mute);text-align:right}
.scroll{overflow:auto;flex:1;padding:12px 14px;min-height:0}
.side{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:14px;min-height:0}
/* chat */
.msg{max-width:94%;padding:9px 12px;border-radius:12px;margin:0 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{margin-left:auto;background:var(--me)}
.msg.ai{background:var(--soft)}
.msg.sys{background:transparent;color:var(--mute);font-size:14px;padding:0 2px}
.card{border:2px solid var(--accent);border-radius:12px;padding:10px 12px;margin:2px 0 12px;background:var(--panel)}
.card.done{border-color:var(--line);opacity:.85}
.card .t{font-weight:700;margin-bottom:4px}
.card ul{margin:4px 0 8px 20px;padding:0}
.why{font-size:14px;color:var(--mute);border-left:3px solid var(--accent);padding-left:8px;margin:6px 0 8px;white-space:pre-wrap}
.err{border:2px solid var(--err);background:var(--err-bg);border-radius:12px;padding:10px 12px;margin:2px 0 12px}
.err .t{color:var(--err);font-weight:700}
code,.mono{font-family:var(--mono);font-size:.9em}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.b{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:6px 12px;font-size:15px}
.b:hover{border-color:var(--accent)}
.b.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.b:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 11px;font-size:14px}
.chip:hover{border-color:var(--accent)}
form.in{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px}
form.in textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;background:var(--bg);color:var(--ink);min-width:0;height:44px}
.thinking{color:var(--mute);font-style:italic}
/* preview */
.stagewrap{flex:1;min-height:220px;margin:12px 12px 8px;border-radius:12px;background:var(--stage);position:relative;overflow:hidden}
.stagewrap.prop{outline:4px dashed var(--accent);outline-offset:-4px}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.tag{position:absolute;top:10px;left:10px;font-size:13px;background:var(--panel);color:var(--ink);border-radius:6px;padding:3px 8px;z-index:2;pointer-events:none}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--stage-ink);padding:20px}
.pad{display:flex;gap:8px;padding:0 12px 8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.pad .b{padding:6px 14px;font-size:18px;line-height:1}
.status b{font-weight:700}
.status .ok{color:var(--ok)} .status .bad{color:var(--err)}
.codehead{display:flex;align-items:center;gap:8px;padding:0 12px 6px;font-size:14px;color:var(--mute);flex-wrap:wrap}
.codehead .sp{margin-left:auto}
pre.code,textarea.code{margin:0 12px 12px;background:var(--code);color:var(--code-ink);border-radius:10px;padding:10px 0;font:13px/1.55 var(--mono);overflow:auto;max-height:200px;min-height:80px;tab-size:2}
pre.code span{display:block;padding:0 12px;white-space:pre}
pre.code span.hl{background:var(--code-hl)}
pre.code span.bad{background:var(--code-err)}
textarea.code{width:calc(100% - 24px);padding:10px 12px;border:0;resize:vertical;white-space:pre}
/* project + library */
.ver{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px}
.ver:last-child{border:0}
.dot{width:11px;height:11px;border-radius:50%;margin-top:6px;flex:none;background:var(--line)}
.ver.cur .dot{background:var(--ok)}
.ver .v{font-size:13px;color:var(--mute)}
.ver .b{margin-left:auto;font-size:13px;padding:3px 8px}
.lib{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:14px;overflow-wrap:anywhere}
.lib.used{border-color:var(--accent)}
.lib b{font-size:15px}
.lib .ref{font:11.5px/1.35 var(--mono);color:var(--accent);margin:2px 0}
.lib .lic{float:right;font-size:12px;color:var(--ok);margin-left:6px}
.note{font-size:13px;color:var(--mute);margin:0 0 8px}
.kind{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
@media (max-width:1000px){
  main{grid-template-columns:minmax(0,1fr);height:auto}
  #previewPanel{order:-1}
  .panel{min-height:0}
  #chatPanel .scroll{max-height:60vh}
  .stagewrap{min-height:0;aspect-ratio:16/9;flex:none}
  .side{grid-template-rows:auto auto}
  .side .scroll{max-height:50vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header>
  <h1 class="brand">Spill<span>verksted</span></h1>
  <label class="mono" for="pname" style="font-size:13px;color:var(--mute)">Prosjekt</label>
  <input id="pname" value="Mitt første spill" aria-label="Prosjektnavn">
  <div class="levels" id="levels" title=""></div>
</header>

<main>
  <section class="panel" id="chatPanel" aria-label="Samtale">
    <h2>Samtale <small>Hjelperen foreslår, du bestemmer</small></h2>
    <div class="scroll" id="chat" aria-live="polite"></div>
    <form class="in" id="form">
      <textarea id="ask" placeholder="Skriv hva du vil lage eller endre …" aria-label="Melding til hjelperen"></textarea>
      <button class="b p" id="send" type="submit">Send</button>
    </form>
  </section>

  <section class="panel" id="previewPanel" aria-label="Forhåndsvisning">
    <h2>Forhåndsvisning <small id="pvState"></small></h2>
    <div class="stagewrap" id="stage"><div class="empty" id="stageEmpty">Her vises spillet ditt.<br>Velg en mal eller fortell hjelperen hva du vil lage.</div></div>
    <div class="pad">
      <button class="b" type="button" data-key="ArrowLeft" aria-label="Venstre">◀</button>
      <button class="b" type="button" data-key=" " aria-label="Hopp">▲</button>
      <button class="b" type="button" data-key="ArrowRight" aria-label="Høyre">▶</button>
      <span class="status" id="status">Klikk på spillet, og bruk piltastene og mellomrom.</span>
    </div>
    <div class="codehead">
      <span id="codeLabel">Koden</span>
      <span class="sp"></span>
      <button class="b" type="button" id="editBtn">Rediger selv</button>
      <button class="b p" type="button" id="tryBtn" hidden>Prøv</button>
    </div>
    <pre class="code" id="code" aria-label="Koden til spillet"></pre>
    <textarea class="code" id="codeEdit" spellcheck="false" hidden aria-label="Rediger koden"></textarea>
  </section>

  <div class="side">
    <section class="panel" aria-label="Prosjekt">
      <h2>Prosjekt <small id="verLabel"></small></h2>
      <div class="scroll" id="proj"></div>
    </section>
    <section class="panel" aria-label="Bibliotek">
      <h2>Bibliotek <small>etter formål</small></h2>
      <div class="scroll" id="lib"></div>
    </section>
  </div>
</main>

<script>
const KAPLAY_URL = "https://cdn.jsdelivr.net/npm/kaplay@3001.0.19/dist/kaplay.js";
const LEVELS = [
  "Endre tall i et ferdig spill", "Bestille endringer fra hjelperen", "Lese og forklare koden",
  "Skrive egen kode som hjelperen ser over", "Dele spillet i oppgaver for flere AI-roller"];
const LEVEL = 2;
const LIB = [
  ["template.platformer","Hoppespill-mal","template","purpose://candidate.game.platformer-template","MIT (HAVEN)","Figur som hopper mellom plattformer."],
  ["template.catch","Fangespill-mal","template","purpose://candidate.game.catch-template","MIT (HAVEN)","Fang det som faller ned."],
  ["api.kaplay.onKeyPress","onKeyPress / onKeyDown","api","purpose://candidate.game.react-to-input","MIT","Gjør noe når du trykker på en tast."],
  ["api.kaplay.body-jump","body() og jump()","api","purpose://candidate.game.gravity-and-jump","MIT","Får figuren til å falle og hoppe."],
  ["api.kaplay.onCollide","area() og onCollide","api","purpose://candidate.game.detect-collision","MIT","Merker når to ting treffer hverandre."],
  ["api.kaplay.move","move()","api","purpose://candidate.game.move-object","MIT","Flytter noe et antall punkter per sekund."],
  ["api.kaplay.add-destroy","add() og destroy()","api","purpose://candidate.game.spawn-and-remove","MIT","Lag nye ting eller fjern dem."],
  ["api.kaplay.text","text()","api","purpose://candidate.game.show-score","MIT","Skriver tekst på skjermen, som poeng."],
  ["api.kaplay.wait-loop","wait() og loop()","api","purpose://candidate.game.timing","MIT","Gjør noe om litt, eller igjen og igjen."],
  ["api.kaplay.scene-go","scene() og go()","api","purpose://candidate.game.switch-scene","MIT","Bytter mellom startskjerm, spill og ferdig."]
].map(([id,title,kind,ref,lic,child]) => ({id,title,kind,ref,lic,child}));

const TEMPLATES = {
"template.platformer": `// Hoppespill. Prøv å endre tallene her øverst!
const HOPP = 640;    // hvor høyt figuren hopper
const FART = 240;    // hvor fort figuren går
const TYNGDE = 1600; // hvor fort figuren faller

kaplay({ width: 640, height: 360, letterbox: true, background: [20, 33, 61], global: true });
setGravity(TYNGDE);

// bakken og plattformene
add([rect(640, 40), pos(0, 320), area(), body({ isStatic: true }), color(59, 125, 79)]);
for (const [x, y] of [[170, 250], [330, 190], [490, 130]]) {
  add([rect(100, 14, { radius: 4 }), pos(x, y), area(), body({ isStatic: true }), color(139, 211, 221)]);
}

// figuren
const spiller = add([rect(32, 32, { radius: 10 }), pos(60, 260), area(), body(), color(255, 204, 77)]);

// mynter og teller
let poeng = 0;
const teller = add([text("Mynter: 0", { size: 20 }), pos(12, 12)]);
for (const [x, y] of [[210, 222], [370, 162], [530, 102]]) {
  add([rect(18, 18, { radius: 9 }), pos(x, y), area(), color(255, 214, 10), "mynt"]);
}

onKeyDown("left", () => spiller.move(-FART, 0));
onKeyDown("right", () => spiller.move(FART, 0));
onKeyPress(["space", "up"], () => { if (spiller.isGrounded()) spiller.jump(HOPP); });

spiller.onCollide("mynt", (m) => {
  destroy(m);
  poeng = poeng + 1;
  teller.text = "Mynter: " + poeng;
});
`,
"template.catch": `// Fangespill. Fang de gule kulene før de treffer bakken!
const FART = 360;     // hvor fort kurven flytter seg
const FALL = 160;     // hvor fort kulene faller
const HVER = 0.9;     // sekunder mellom hver nye kule

kaplay({ width: 640, height: 360, letterbox: true, background: [20, 33, 61], global: true });

const kurv = add([rect(80, 16, { radius: 6 }), pos(280, 330), area(), color(232, 89, 12)]);
let poeng = 0;
const teller = add([text("Fanget: 0", { size: 20 }), pos(12, 12)]);

onKeyDown("left", () => { if (kurv.pos.x > 0) kurv.move(-FART, 0); });
onKeyDown("right", () => { if (kurv.pos.x < 560) kurv.move(FART, 0); });

loop(HVER, () => {
  add([circle(10), pos(rand(20, 620), -10), area({ shape: new Rect(vec2(-10, -10), 20, 20) }), color(255, 214, 10), move(DOWN, FALL), offscreen({ destroy: true }), "kule"]);
});

kurv.onCollide("kule", (k) => {
  destroy(k);
  poeng = poeng + 1;
  teller.text = "Fanget: " + poeng;
});
`};

/* ---------- state ---------- */
const KEY = "spillverksted.proto.v1";
let S = { name: "Mitt første spill", versions: [], cur: -1, chat: [], pending: null };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && Array.isArray(s.versions)) S = Object.assign(S, s); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
let sample = null, busy = false, previewing = null, lastError = null, runId = 0, editing = false;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const curCode = () => (S.cur >= 0 ? S.versions[S.cur].code : "");

/* ---------- sandboxed preview ---------- */
const HEAD = `<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#14213d;overflow:hidden}canvas{display:block}</style>
<script src="${KAPLAY_URL}"><\/script></head><body><script>
(function(){var T=__TOKEN__;function s(m){m.sv=T;parent.postMessage(m,"*");}
window.onerror=function(msg,src,line){s({type:"error",msg:String(msg),line:line});};
window.addEventListener("unhandledrejection",function(e){s({type:"error",msg:String(e.reason)});});
var ce=console.error;console.error=function(){try{s({type:"error",msg:Array.prototype.map.call(arguments,String).join(" ")});}catch(x){}ce.apply(console,arguments);};
window.addEventListener("message",function(e){var d=e.data||{};if(!d.key)return;var t=document.querySelector("canvas")||document.body;
t.dispatchEvent(new KeyboardEvent(d.down?"keydown":"keyup",{key:d.key,code:d.key===" "?"Space":d.key,bubbles:true}));});
if(typeof kaplay!=="function")s({type:"error",msg:"Fant ikke KAPLAY. Sjekk nettet og prøv igjen."});
setTimeout(function(){s({type:"ok"});},1200);})();
<\/script><script>
`;
const HEAD_LINES = HEAD.split("\n").length - 1;
function run(code, label, isProposal) {
  const token = ++runId;
  lastError = null;
  $("stageEmpty")?.remove();
  $("stage").querySelector("iframe")?.remove();
  $("stage").querySelector(".tag")?.remove();
  if (!code) { $("stage").insertAdjacentHTML("beforeend", `<div class="empty" id="stageEmpty">Her vises spillet ditt.<br>Velg en mal eller fortell hjelperen hva du vil lage.</div>`); setStatus(""); return; }
  const f = document.createElement("iframe");
  f.setAttribute("sandbox", "allow-scripts");
  f.setAttribute("title", "Spillet");
  f.srcdoc = HEAD.replace("__TOKEN__", token) + code + "\n<\/script></body></html>";
  $("stage").appendChild(f);
  if (label) $("stage").insertAdjacentHTML("beforeend", `<span class="tag">${esc(label)}</span>`);
  $("stage").classList.toggle("prop", !!isProposal);
  $("pvState").textContent = label || "";
  setStatus(`KAPLAY i sandkasse · starter …`);
  f.addEventListener("load", () => { try { f.focus(); } catch (e) {} });
}
function setStatus(html) { $("status").innerHTML = html || "Klikk på spillet, og bruk piltastene og mellomrom."; }
window.addEventListener("message", (e) => {
  const f = $("stage").querySelector("iframe");
  if (!f || e.source !== f.contentWindow) return;
  const d = e.data || {};
  if (d.sv !== runId) return;
  if (d.type === "error" && !lastError) {
    const line = d.line ? d.line - HEAD_LINES : null;
    lastError = { msg: d.msg, line: line && line > 0 ? line : null };
    setStatus(`KAPLAY i sandkasse · <b class="bad">stoppet</b> · resten av siden er ikke påvirket`);
    onPreviewError();
  } else if (d.type === "ok" && !lastError) {
    setStatus(`KAPLAY i sandkasse · <b class="ok">kjører</b> · klikk på spillet, bruk piltaster og mellomrom`);
  }
});
document.querySelectorAll(".pad [data-key]").forEach((b) => {
  const send = (down) => { const f = $("stage").querySelector("iframe"); f?.contentWindow?.postMessage({ key: b.dataset.key, down }, "*"); };
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); send(true); });
  ["pointerup", "pointerleave", "pointercancel"].forEach((t) => b.addEventListener(t, () => send(false)));
});

/* ---------- code view ---------- */
function showCode(code, base) {
  const old = new Set((base ?? code).split("\n").map((l) => l.trim()));
  const bad = lastError?.line;
  $("code").innerHTML = code ? code.split("\n").map((l, i) => {
    const cls = bad === i + 1 ? "bad" : (base != null && l.trim() && !old.has(l.trim()) ? "hl" : "");
    return `<span class="${cls}">${esc(l) || " "}</span>`;
  }).join("") : `<span>// Ingen kode ennå</span>`;
  $("codeLabel").textContent = base != null ? "Koden i forslaget (nye linjer er markert)" : "Koden";
  $("code").querySelector(".bad,.hl")?.scrollIntoView({ block: "nearest" });
}
$("editBtn").onclick = () => {
  editing = !editing;
  $("code").hidden = editing; $("codeEdit").hidden = !editing; $("tryBtn").hidden = !editing;
  $("editBtn").textContent = editing ? "Avbryt" : "Rediger selv";
  if (editing) { $("codeEdit").value = previewing ? previewing.code : curCode(); $("codeEdit").focus(); }
};
$("tryBtn").onclick = () => {
  const code = $("codeEdit").value;
  $("editBtn").click();
  propose({ title: "Din egen endring", changes: ["Du endret koden selv"], why: "", usedLibrary: [], code, own: true });
};

/* ---------- proposals ---------- */
function propose(p) {
  S.pending = { ...p, n: S.chat.filter((m) => m.proposal).length + 1 };
  S.chat.push({ role: "ai", text: p.own ? "" : (p.reply || ""), proposal: S.pending });
  previewing = S.pending;
  save(); render();
  run(p.code, `Forslag ${S.pending.n}, ikke lagret`, true);
  showCode(p.code, curCode());
}
function accept() {
  const p = S.pending; if (!p) return;
  S.versions.push({ title: p.title, code: p.code, at: new Date().toISOString() });
  S.cur = S.versions.length - 1;
  p.state = "brukt"; S.pending = null; previewing = null;
  save(); render();
  run(curCode(), `Versjon ${S.cur + 1}`, false); showCode(curCode());
}
function discard(silent) {
  const p = S.pending; if (!p) return;
  p.state = "forkastet"; S.pending = null; previewing = null;
  save(); render();
  run(curCode(), S.cur >= 0 ? `Versjon ${S.cur + 1}` : "", false); showCode(curCode());
}
function onPreviewError() {
  showCode(previewing ? previewing.code : curCode(), previewing ? curCode() : null);
  if (previewing) {
    previewing.error = lastError; save(); render();
  } else {
    S.chat.push({ role: "sys", text: `Spillet stoppet: ${lastError.msg}` }); save(); render();
  }
}
function restore(i) {
  const v = S.versions[i];
  S.versions.push({ title: `Tilbake til versjon ${i + 1}`, code: v.code, at: new Date().toISOString() });
  S.cur = S.versions.length - 1;
  if (S.pending) { S.pending.state = "forkastet"; S.pending = null; previewing = null; }
  save(); render(); run(curCode(), `Versjon ${S.cur + 1}`, false); showCode(curCode());
}
function startTemplate(id) {
  if (S.pending) discard(true);
  S.versions.push({ title: id === "template.catch" ? "Startet fra fangespill-malen" : "Startet fra hoppespill-malen", code: TEMPLATES[id], at: new Date().toISOString(), lib: [id] });
  S.cur = S.versions.length - 1;
  S.chat.push({ role: "ai", text: id === "template.catch"
    ? "Nå har du et fangespill. Prøv det! Tallene øverst i koden bestemmer hvor fort ting går. Hva vil du endre?"
    : "Nå har du et hoppespill. Prøv det! Tallene øverst i koden bestemmer hvor høyt og fort figuren hopper. Hva vil du endre?" });
  save(); render(); run(curCode(), `Versjon ${S.cur + 1}`, false); showCode(curCode());
}

/* ---------- the helper ---------- */
function prompt(wish) {
  const hist = S.chat.slice(-10).map((m) => m.role === "me" ? `Sverre: ${m.text}` : m.role === "ai" ? `Hjelper: ${m.text}${m.proposal ? ` [forslag «${m.proposal.title}», ${m.proposal.state || "venter"}]` : ""}` : `System: ${m.text}`).join("\n");
  return `Du er hjelperen i Spillverkstedet i HAVEN. Du hjelper Sverre (10–12 år) å lage sitt eget nettleserspill og å lære programmering. Han er på nivå ${LEVEL}: «${LEVELS[LEVEL - 1]}».

Regler:
- Svar på norsk bokmål, kort og vennlig, som til et barn som leser godt. Høyst tre setninger i "reply".
- Du foreslår, Sverre bestemmer. Lag høyst ett forslag om gangen, og bare små steg.
- Hvis ønsket er uklart på en måte som endrer hva som lages, still ett kort spørsmål i "question" og la "proposal" være null.
- Koden er KAPLAY 3001 i global modus. Lever hele programmet i "code". Kall kaplay({ width: 640, height: 360, letterbox: true, global: true, background: [...] }) én gang.
- Bruk bare KAPLAY-funksjoner og vanlig JavaScript. Ingen fetch, import, localStorage, eksterne bilder eller lyder (tegn med rect, circle, polygon og text).
- Behold konstantene øverst med korte norske kommentarer, så Sverre kan endre tallene selv. Gi variabler norske navn.
- "why" forklarer én eller to av funksjonene du brukte, så et barn forstår hva de gjør.
- "usedLibrary" lister id-er fra biblioteket du brukte.
- Hvis det står en feil under, rett den først og si kort hva som var galt.

Bibliotek (id: hva det løser):
${LIB.map((l) => `${l.id}: ${l.child}`).join("\n")}

Nåværende kode (versjon ${S.cur + 1}):
\`\`\`js
${curCode() || "// tomt prosjekt"}
\`\`\`
${previewing?.error ? `\nForslaget «${previewing.title}» krasjet: ${previewing.error.msg}${previewing.error.line ? ` (linje ${previewing.error.line})` : ""}\nKoden som krasjet:\n\`\`\`js\n${previewing.code}\n\`\`\`\n` : ""}
Samtalen så langt:
${hist || "(ingen)"}

Sverre skriver nå: ${wish}

Svar med bare JSON, uten noe annet:
{"reply": "...", "question": null, "proposal": null}
eller
{"reply": "...", "question": null, "proposal": {"title": "kort tittel", "changes": ["...", "..."], "why": "...", "usedLibrary": ["..."], "code": "hele programmet"}}`;
}
async function ask(wish) {
  wish = wish.trim(); if (!wish || busy) return;
  S.chat.push({ role: "me", text: wish }); save(); render();
  if (!sample) {
    S.chat.push({ role: "sys", text: "Hjelperen er ikke tilgjengelig i denne visningen. Du kan fortsatt starte fra en mal og endre koden selv." });
    save(); render(); return;
  }
  busy = true; render();
  const input = prompt(wish);
  try {
    const r = await sample.json(input, { modelTier: "default", cache: false });
    if (S.pending) { S.pending.state = "forkastet"; S.pending = null; previewing = null; }
    if (r && r.proposal && typeof r.proposal.code === "string" && r.proposal.code.includes("kaplay(")) {
      busy = false;
      propose({ ...r.proposal, reply: [r.reply, r.question].filter(Boolean).join("\n") });
    } else {
      S.chat.push({ role: "ai", text: [r?.reply, r?.question].filter(Boolean).join("\n") || "Jeg forsto ikke helt. Kan du si det på en annen måte?" });
      if (previewing) { run(curCode(), S.cur >= 0 ? `Versjon ${S.cur + 1}` : "", false); showCode(curCode()); }
    }
  } catch (e) {
    const why = { not_granted: "Du må gi siden lov til å bruke Claude før hjelperen kan svare.", rate_limited: "Hjelperen trenger en liten pause. Prøv igjen om litt." }[e?.code]
      || "Hjelperen fikk ikke svart. Prøv igjen, eller si det med andre ord.";
    S.chat.push({ role: "sys", text: why });
    if (e?.code === "not_granted") sample = null;
  } finally { busy = false; save(); render(); }
}
$("form").addEventListener("submit", (e) => { e.preventDefault(); const t = $("ask").value; $("ask").value = ""; ask(t); });
$("ask").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });
$("pname").addEventListener("change", () => { S.name = $("pname").value.trim() || "Mitt første spill"; save(); });

/* ---------- render ---------- */
function render() {
  $("pname").value = S.name;
  $("levels").title = `Nivå ${LEVEL}: ${LEVELS[LEVEL - 1]}`;
  $("levels").innerHTML = `Nivå ${LEVEL}` + LEVELS.map((t, i) => `<i class="${i < LEVEL ? "on" : ""}" title="Nivå ${i + 1}: ${esc(t)}"></i>`).join("");
  const c = $("chat");
  let h = `<div class="msg ai">Hei Sverre! Hva vil du lage i dag? Beskriv et spill med egne ord, eller start fra en mal.</div>`;
  h += `<div class="chips"><button class="chip" data-tpl="template.platformer">Start et hoppespill</button><button class="chip" data-tpl="template.catch">Start et fangespill</button></div>`;
  for (const m of S.chat) {
    if (m.text) h += `<div class="msg ${m.role}">${esc(m.text)}</div>`;
    const p = m.proposal;
    if (p) {
      const live = S.pending === p || (S.pending && p.n === S.pending.n && !p.state);
      if (p.error && live) {
        h += `<div class="err"><div class="t">Forslag ${p.n} virket ikke</div>Spillet stoppet: <code>${esc(p.error.msg)}</code>${p.error.line ? ` på linje ${p.error.line}` : ""}. Ingenting er lagret.
          <div class="btns" style="margin-top:8px">${sample ? `<button class="b p" data-act="fix">La hjelperen rette</button>` : ""}<button class="b" data-act="discard">Forkast</button></div></div>`;
      } else {
        h += `<div class="card ${live ? "" : "done"}"><div class="t">Forslag ${p.n}: ${esc(p.title)}</div>
          ${p.changes?.length ? `<ul>${p.changes.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
          ${p.why ? `<div class="why">Hvorfor: ${esc(p.why)}</div>` : ""}
          ${live ? `<div class="btns"><button class="b p" data-act="accept">Bruk</button>${p.own ? "" : `<button class="b" data-act="change">Endre</button>`}<button class="b" data-act="discard">Forkast</button></div>`
                 : `<div class="note" style="margin:0">${p.state === "brukt" ? "Brukt" : "Forkastet"}</div>`}</div>`;
      }
    }
  }
  if (busy) h += `<div class="msg ai thinking">Hjelperen tenker …</div>`;
  if (S.versions.length && !S.pending && !busy && sample) h += `<div class="chips"><button class="chip" data-say="Kan figuren hoppe høyere?">Hopp høyere</button><button class="chip" data-say="Legg til en fiende som går fram og tilbake.">Legg til en fiende</button><button class="chip" data-say="Lag en startskjerm og en ferdig-skjerm.">Start og ferdig</button></div>`;
  c.innerHTML = h;
  c.scrollTop = c.scrollHeight;
  $("send").disabled = busy;

  $("verLabel").textContent = S.cur >= 0 ? `versjon ${S.cur + 1}` : "";
  $("proj").innerHTML = S.versions.length ? S.versions.map((v, i) => `<div class="ver ${i === S.cur ? "cur" : ""}"><span class="dot"></span><div><b>${esc(v.title)}</b><div class="v">versjon ${i + 1}${i === S.cur ? " · i bruk" : ""}</div></div>${i !== S.cur ? `<button class="b" data-restore="${i}">Gå tilbake hit</button>` : ""}</div>`).reverse().join("")
    + (S.versions.length > 1 ? `<div class="btns" style="margin-top:10px"><button class="b" data-act="reset">Start helt på nytt</button></div>` : "")
    : `<p class="note">Ingen versjoner ennå. Når du trykker «Bruk» på et forslag, lagres det her, og du kan alltid gå tilbake.</p>`;

  const used = new Set(previewing?.usedLibrary || (S.cur >= 0 ? S.versions[S.cur].lib || [] : []));
  const list = used.size ? LIB.filter((l) => used.has(l.id)).concat(LIB.filter((l) => !used.has(l.id))) : LIB;
  $("lib").innerHTML = `<p class="note">${used.size ? "Markert: brukt i det du ser nå." : "Hjelperen velger herfra. Hver oppføring er merket med formålet den løser."}</p>`
    + list.map((l) => `<div class="lib ${used.has(l.id) ? "used" : ""}"><span class="lic">${esc(l.lic)}</span><span class="kind">${l.kind === "template" ? "mal" : "funksjon"}</span><br><b>${esc(l.title)}</b><div class="ref">${esc(l.ref)}</div>${esc(l.child)}${l.kind === "template" ? `<div style="margin-top:6px"><button class="b" data-tpl="${l.id}">Start fra denne</button></div>` : ""}</div>`).join("");
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.tpl) startTemplate(t.dataset.tpl);
  else if (t.dataset.say) ask(t.dataset.say);
  else if (t.dataset.restore) restore(+t.dataset.restore);
  else if (t.dataset.act === "accept") accept();
  else if (t.dataset.act === "discard") discard();
  else if (t.dataset.act === "change") { $("ask").value = "Endre forslaget: "; $("ask").focus(); }
  else if (t.dataset.act === "fix") ask("Rett feilen i forslaget.");
  else if (t.dataset.act === "reset") { S = { name: S.name, versions: [], cur: -1, chat: [], pending: null }; previewing = null; save(); render(); run("", "", false); showCode(""); }
});

/* ---------- boot ---------- */
if (S.pending) { const m = S.chat.find((m) => m.proposal && m.proposal.n === S.pending.n); if (m) S.pending = m.proposal; previewing = S.pending; }
render();
if (previewing) { run(previewing.code, `Forslag ${previewing.n}, ikke lagret`, true); showCode(previewing.code, curCode()); }
else if (S.cur >= 0) { run(curCode(), `Versjon ${S.cur + 1}`, false); showCode(curCode()); }
else { showCode(""); }
(async () => {
  try { sample = await window.claude?.use?.("sample"); } catch (e) { sample = null; }
  render();
})();
</script>
