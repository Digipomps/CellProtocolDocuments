<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>HAVEN Agent — planlagte jobber i menylinjen (skisse)</title>
<style>
  :root { --bar: #e9e6e1; --menu: rgba(246,246,246,0.97); --line: #d6d6d6; --ink: #1d1d1f; --dim: #8e8e93; --sel: #2f6fe0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: linear-gradient(160deg, #c9b79c 0%, #8d7a66 55%, #5d5148 100%); font-family: "Helvetica Neue", "Liberation Sans", "Arimo", "DejaVu Sans", Arial, sans-serif; font-size: 13px; color: var(--ink); }
  .stage { width: 1180px; height: 520px; position: relative; overflow: hidden; }
  .bar { position: absolute; left: 0; right: 0; top: 0; height: 26px; background: var(--bar); display: flex; align-items: center; justify-content: flex-end; padding: 0 14px; gap: 16px; font-size: 13px; }
  .bar .clock { color: #222; }
  .bar .icon { display: flex; align-items: center; gap: 3px; padding: 2px 7px; border-radius: 5px; background: rgba(0,0,0,0.12); }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #1d1d1f; display: inline-block; }
  .bang { width: 13px; height: 13px; border-radius: 50%; background: #1d1d1f; color: #e9e6e1; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .menu { position: absolute; background: var(--menu); border-radius: 7px; border: 1px solid rgba(0,0,0,0.18); box-shadow: 0 12px 34px rgba(0,0,0,0.33); padding: 5px; }
  .item { height: 23px; display: flex; align-items: center; justify-content: space-between; padding: 0 9px; border-radius: 4px; white-space: nowrap; gap: 26px; }
  .item.text { color: var(--dim); }
  .item.sel { background: var(--sel); color: #fff; }
  .item .key, .item .arrow { color: var(--dim); font-size: 12px; }
  .item.sel .arrow { color: #fff; }
  .sep { height: 1px; background: var(--line); margin: 5px 9px; }
  .note { position: absolute; left: 22px; bottom: 16px; color: #fff; font-size: 12px; opacity: 0.92; max-width: 420px; line-height: 1.45; text-shadow: 0 1px 2px rgba(0,0,0,0.4); }
  .tag { position: absolute; left: 22px; top: 44px; color: #fff; font-size: 15px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.4); }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const state = new URLSearchParams(location.search).get("state") || "ro";
const stage = document.getElementById("stage");
function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
function item(label, opts = {}) {
  const cls = ["item"]; if (opts.text) cls.push("text"); if (opts.sel) cls.push("sel");
  const right = opts.arrow ? '<span class="arrow">›</span>' : (opts.key ? `<span class="key">${opts.key}</span>` : "");
  return `<div class="${cls.join(" ")}"><span>${label}</span>${right}</div>`;
}
const sep = '<div class="sep"></div>';
function menu(x, y, rows) { return `<div class="menu" style="left:${x}px;top:${y}px">${rows.join("")}</div>`; }

if (state === "ro") {
  stage.append(el('<div class="tag">Tilstand 1: alt går</div>'));
  stage.append(el('<div class="bar"><span class="icon"><span class="dot"></span></span><span class="clock">fre. 2. okt. 13:02</span></div>'));
  stage.append(el(menu(498, 30, [
    item("Ingenting venter", {text: true}),
    item("Alle 6 leste kilder er tomme. Sist lest 13:02.", {text: true}),
    sep,
    item("Planlagte jobber", {arrow: true, sel: true}),
    sep,
    item("Åpne adminflate…", {key: "⌘A"}),
    item("Oppdater nå", {key: "⌘R"}),
    item("Varsler: av", {text: true}),
    item("Varselinnstillinger…"),
    sep,
    item("Avslutt", {key: "⌘Q"}),
  ])));
  stage.append(el(menu(812, 86, [
    item("3 jobber går · neste 13:30", {text: true}),
    sep,
    item("Losens kø — går", {arrow: true, sel: true}),
    item("Korrespondansesjekk — hvert 30. minutt", {arrow: true}),
    item("Fristvarsel — daglig 09:00", {arrow: true}),
  ])));
  stage.append(el(menu(498, 300, [
    item("Siste jobb 12:57 · ferdig uten feil", {text: true}),
    item("Ingen jobber i køen", {text: true}),
    sep,
    item("Stopp køen"),
  ])));
  stage.append(el('<div class="note">Undermenyen for «Losens kø» står egentlig til høyre for «Planlagte jobber». Her er den flyttet ned for å få plass i bildet.</div>'));
} else {
  stage.append(el('<div class="tag">Tilstand 2: en jobb feilet, en ble passert, køen er stoppet</div>'));
  stage.append(el('<div class="bar"><span class="icon"><span class="bang">!</span><span>2</span></span><span class="clock">fre. 2. okt. 13:31</span></div>'));
  stage.append(el(menu(440, 30, [
    item("2 saker venter på deg", {text: true}),
    sep,
    item("Planlagt jobb feilet: Korrespondansesjekk", {arrow: true, sel: true}),
    item("Planlagt jobb ble passert: Fristvarsel", {arrow: true}),
    sep,
    item("Planlagte jobber", {arrow: true}),
    sep,
    item("Åpne adminflate…", {key: "⌘A"}),
    item("Oppdater nå", {key: "⌘R"}),
    item("Varsler: av", {text: true}),
    item("Varselinnstillinger…"),
    sep,
    item("Avslutt", {key: "⌘Q"}),
  ])));
  stage.append(el(menu(788, 62, [
    item("Agenten · planlagte jobber · 13:30", {text: true}),
    item("Programmet avsluttet med status 1", {text: true}),
    sep,
    item("Åpne"),
    item("Ignorer i dag"),
  ])));
  stage.append(el(menu(440, 348, [
    item("2 jobber går · neste 14:00", {text: true}),
    sep,
    item("Losens kø — stoppet 13:12 fra menylinjen", {arrow: true, sel: true}),
    item("Korrespondansesjekk — sist 13:30 · feilet", {arrow: true}),
    item("Fristvarsel — passert 09:00, kjørt 11:42", {arrow: true}),
  ])));
  stage.append(el(menu(830, 412, [
    item("2 jobber venter i køen", {text: true}),
    sep,
    item("Start køen"),
  ])));
  stage.append(el('<div class="note" style="left:22px;bottom:16px;max-width:380px">De to nederste menyene er undermenyene til «Planlagte jobber» og «Losens kø». De er flyttet ned for å få plass i bildet.</div>'));
}
</script>
</body>
</html>
