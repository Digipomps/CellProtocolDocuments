<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Inter, system-ui, -apple-system, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0b0b0c"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff634f"/></marker></defs>
<rect width="1120" height="560" fill="#f5f6f1"/>
<text x="40" y="44" font-size="19" font-weight="800" fill="#0b0b0c">I dag</text>
<text x="40" y="66" font-size="12.5" fill="#60635e">Vernet stopper på tråden. Den som kan spille av, kan lagre fila.</text>
<rect x="40" y="90" width="190" height="66" rx="6" fill="#ffffff" stroke="#ff634f" stroke-width="2"/><text x="135.0" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0c">Fil på disk</text><text x="135.0" y="133" text-anchor="middle" font-size="11.5" fill="#60635e">ID3 · vanlig MP3</text><text x="135.0" y="148" text-anchor="middle" font-size="11.5" fill="#60635e">ikke kryptert</text>
<line x1="135" y1="156" x2="135" y2="192" stroke="#0b0b0c" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="40" y="192" width="190" height="66" rx="6" fill="#ffffff" stroke="#0b0b0c" stroke-width="1.5"/><text x="135.0" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0c">Serveren</text><text x="135.0" y="235" text-anchor="middle" font-size="11.5" fill="#60635e">dekrypterer ingenting</text><text x="135.0" y="250" text-anchor="middle" font-size="11.5" fill="#60635e">sender hele fila</text>
<line x1="135" y1="258" x2="135" y2="294" stroke="#0b0b0c" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="40" y="294" width="190" height="66" rx="6" fill="#ffffff" stroke="#0b0b0c" stroke-width="1.5"/><text x="135.0" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0c">Én URL</text><text x="135.0" y="337" text-anchor="middle" font-size="11.5" fill="#60635e">gir hele låta</text><text x="135.0" y="352" text-anchor="middle" font-size="11.5" fill="#60635e">Range-oppslag</text>
<line x1="135" y1="360" x2="135" y2="396" stroke="#0b0b0c" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="40" y="396" width="190" height="58" rx="6" fill="#ffffff" stroke="#0b0b0c" stroke-width="1.5"/><text x="135.0" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0c">Nettleseren</text><text x="135.0" y="439" text-anchor="middle" font-size="11.5" fill="#60635e">spiller av</text>
<line x1="230" y1="323" x2="330" y2="323" stroke="#ff634f" stroke-width="2" marker-end="url(#ac)"/>
<text x="243" y="316" font-size="12" font-weight="700" fill="#ff634f">Lagre som…</text>
<text x="243" y="341" font-size="11.5" fill="#ff634f">spillbar fil ut av huset</text>
<line x1="520" y1="88" x2="520" y2="500" stroke="#c9cbc4" stroke-width="1"/>
<text x="560" y="44" font-size="19" font-weight="800" fill="#0b0b0c">Etter</text>
<text x="560" y="66" font-size="12.5" fill="#60635e">Ingen enkelt adresse gir låta. Lyden settes sammen i spillerens minne.</text>
<rect x="560" y="90" width="200" height="66" rx="6" fill="#ffffff" stroke="#2aaeb7" stroke-width="2"/><text x="660.0" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0c">Fil på disk</text><text x="660.0" y="133" text-anchor="middle" font-size="11.5" fill="#60635e">kryptert · AES-128</text><text x="660.0" y="148" text-anchor="middle" font-size="11.5" fill="#60635e">nøkkel per låt</text>
<line x1="660" y1="156" x2="660" y2="192" stroke="#0b0b0c" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="560" y="192" width="200" height="66" rx="6" fill="#ffffff" stroke="#0b0b0c" stroke-width="1.5"/><text x="660.0" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0c">Delt i biter</text><text x="660.0" y="235" text-anchor="middle" font-size="11.5" fill="#60635e">~6 sekunder hver</text><text x="660.0" y="250" text-anchor="middle" font-size="11.5" fill="#60635e">hver bit autorisert</text>
<line x1="660" y1="258" x2="660" y2="294" stroke="#0b0b0c" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="560" y="294" width="200" height="66" rx="6" fill="#ffffff" stroke="#0b0b0c" stroke-width="1.5"/><text x="660.0" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0c">Spilleliste (m3u8)</text><text x="660.0" y="337" text-anchor="middle" font-size="11.5" fill="#60635e">peker på bitene</text><text x="660.0" y="352" text-anchor="middle" font-size="11.5" fill="#60635e">ikke på en lydfil</text>
<line x1="660" y1="360" x2="660" y2="396" stroke="#0b0b0c" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="560" y="396" width="200" height="58" rx="6" fill="#ffffff" stroke="#0b0b0c" stroke-width="1.5"/><text x="660.0" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0c">Spilleren</text><text x="660.0" y="439" text-anchor="middle" font-size="11.5" fill="#60635e">setter sammen i minnet</text>
<rect x="810" y="192" width="230" height="96" rx="6" fill="#ffffff" stroke="#2aaeb7" stroke-width="2"/><text x="925.0" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0c">Nøkkelen</text><text x="925.0" y="235" text-anchor="middle" font-size="11.5" fill="#60635e">samme autorisasjon som lyden</text><text x="925.0" y="250" text-anchor="middle" font-size="11.5" fill="#60635e">samme korte levetid som token</text><text x="925.0" y="265" text-anchor="middle" font-size="11.5" fill="#60635e">bundet til økten</text>
<line x1="810" y1="240" x2="762" y2="240" stroke="#2aaeb7" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="1030" y1="288" x2="1030" y2="440" stroke="#2aaeb7" stroke-width="1.8" stroke-dasharray="4 4"/>
<line x1="1030" y1="440" x2="762" y2="440" stroke="#2aaeb7" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="760" y1="323" x2="850" y2="323" stroke="#c9cbc4" stroke-width="2"/>
<line x1="795" y1="309" x2="817" y2="337" stroke="#ff634f" stroke-width="2.5"/>
<line x1="817" y1="309" x2="795" y2="337" stroke="#ff634f" stroke-width="2.5"/>
<text x="862" y="320" font-size="12" font-weight="700" fill="#60635e">Lagre som…</text>
<text x="862" y="338" font-size="11.5" fill="#60635e">gir en bit, ikke låta</text>
<rect x="40" y="492" width="1040" height="46" rx="6" fill="#ffffff" stroke="#c9cbc4"/>
<text x="58" y="512" font-size="12" font-weight="700" fill="#0b0b0c">Det dette ikke gjør:</text>
<text x="58" y="529" font-size="12" fill="#60635e">Lyd som kan høres, kan tas opp. Den som skripter hele seremonien kommer også gjennom. Terskelen flyttes fra «høyreklikk» til «bevisst teknisk handling» — ikke til umulig.</text>
</svg>