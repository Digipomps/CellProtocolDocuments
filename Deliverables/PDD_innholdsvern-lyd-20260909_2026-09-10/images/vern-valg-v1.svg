<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" font-family="Inter, system-ui, -apple-system, sans-serif">
<rect width="1120" height="660" fill="#f5f6f1"/>
<text x="40" y="46" font-size="20" fill="#0b0b0c" font-weight="800">Vern per l&#229;t</text>
<text x="40" y="70" font-size="13" fill="#60635e">Slik artisten velger i Butterpop Studio. Tre valg, og default er beskyttet.</text>
<rect x="40" y="96" width="1040" height="112" rx="8" fill="#ffffff" stroke="#c9cbc4" stroke-width="1.5"/>
<text x="68" y="136" font-size="16" fill="#0b0b0c" font-weight="700">Sommernatt</text>
<text x="68" y="160" font-size="12" fill="#60635e">publisert &#183; 3:42</text>
<rect x="509" y="125" width="546" height="54" rx="9" fill="#f5f6f1" stroke="#c9cbc4" stroke-width="1.5"/>
<rect x="512" y="128" width="180" height="48" rx="6" fill="#0b0b0c"/>
<text x="602.0" y="158" font-size="14.5" fill="#ffffff" font-weight="700" text-anchor="middle">Beskyttet</text>
<line x1="692" y1="138" x2="692" y2="166" stroke="#c9cbc4" stroke-width="1"/>
<text x="782.0" y="158" font-size="14.5" fill="#60635e" font-weight="600" text-anchor="middle">&#197;pen</text>
<line x1="872" y1="138" x2="872" y2="166" stroke="#c9cbc4" stroke-width="1"/>
<text x="962.0" y="158" font-size="14.5" fill="#60635e" font-weight="600" text-anchor="middle">Nedlastbar</text>
<text x="40" y="242" font-size="11.5" fill="#60635e">&#8592;&#160; strengere vern</text>
<text x="1080" y="242" font-size="11.5" fill="#60635e" text-anchor="end">mer &#229;pent &#160;&#8594;</text>
<rect x="40" y="258" width="330" height="290" rx="8" fill="#ffffff" stroke="#c9cbc4" stroke-width="1.5"/>
<rect x="40" y="258" width="5" height="290" rx="2.5" fill="#2aaeb7"/>
<text x="64" y="294" font-size="17" fill="#0b0b0c" font-weight="800">Beskyttet</text>
<rect x="64" y="306" width="66" height="20" rx="10" fill="#2aaeb7"/>
<text x="97" y="320" font-size="10" fill="#ffffff" font-weight="800" text-anchor="middle">DEFAULT</text>
<text x="64" y="350" font-size="12.5" fill="#60635e">L&#229;ta ligger kryptert og klippet i biter.</text>
<text x="64" y="368" font-size="12.5" fill="#60635e">Spilleren ber om n&#248;kkelen gjennom samme</text>
<text x="64" y="386" font-size="12.5" fill="#60635e">d&#248;r som lyden, og setter lyden sammen</text>
<text x="64" y="404" font-size="12.5" fill="#60635e">i minnet.</text>
<text x="64" y="440" font-size="12.5" fill="#60635e">Det finnes ingen adresse som gir deg fila.</text>
<rect x="64" y="502" width="282" height="28" rx="6" fill="#f5f6f1" stroke="#c9cbc4" stroke-width="1"/>
<text x="205.0" y="521" font-size="11.5" fill="#60635e" font-weight="600" text-anchor="middle">cellManaged &#183; hls</text>
<rect x="395" y="258" width="330" height="290" rx="8" fill="#ffffff" stroke="#c9cbc4" stroke-width="1.5"/>
<rect x="395" y="258" width="5" height="290" rx="2.5" fill="#60635e"/>
<text x="419" y="294" font-size="17" fill="#0b0b0c" font-weight="800">&#197;pen</text>
<text x="419" y="328" font-size="12.5" fill="#60635e">Ukryptert, men kommer bare ut gjennom</text>
<text x="419" y="346" font-size="12.5" fill="#60635e">d&#248;ra som sjekker hvem som sp&#248;r.</text>
<text x="419" y="382" font-size="12.5" fill="#60635e">Er du ikke logget inn og godkjent,</text>
<text x="419" y="400" font-size="12.5" fill="#60635e">f&#229;r du ingenting.</text>
<text x="419" y="436" font-size="12.5" fill="#60635e">Ingen fri adresse.</text>
<rect x="419" y="502" width="282" height="28" rx="6" fill="#f5f6f1" stroke="#c9cbc4" stroke-width="1"/>
<text x="560.0" y="521" font-size="11.5" fill="#60635e" font-weight="600" text-anchor="middle">none &#183; progressive</text>
<rect x="750" y="258" width="330" height="290" rx="8" fill="#ffffff" stroke="#c9cbc4" stroke-width="1.5"/>
<rect x="750" y="258" width="5" height="290" rx="2.5" fill="#ff634f"/>
<text x="774" y="294" font-size="17" fill="#0b0b0c" font-weight="800">Nedlastbar</text>
<text x="774" y="328" font-size="12.5" fill="#60635e">Fritt hentbar adresse. Hvem som helst</text>
<text x="774" y="346" font-size="12.5" fill="#60635e">kan hente fila og beholde den.</text>
<text x="774" y="382" font-size="12.5" fill="#60635e">Protokollen sier det ogs&#229; &#8212; l&#229;ta er</text>
<text x="774" y="400" font-size="12.5" fill="#60635e">merket nedlastbar, slik at ingen tror</text>
<text x="774" y="418" font-size="12.5" fill="#60635e">den er vernet n&#229;r den ikke er det.</text>
<rect x="774" y="502" width="282" height="28" rx="6" fill="#f5f6f1" stroke="#c9cbc4" stroke-width="1"/>
<text x="915.0" y="521" font-size="11.5" fill="#60635e" font-weight="600" text-anchor="middle">none &#183; progressive + download</text>
<rect x="40" y="574" width="1040" height="58" rx="8" fill="#ffffff" stroke="#ff634f" stroke-width="1.5"/>
<text x="64" y="600" font-size="12.5" fill="#0b0b0c" font-weight="600">Lyd som kan h&#248;res, kan tas opp. Ingen av de tre niv&#229;ene hindrer det &#8212; heller ikke det beskyttede.</text>
<text x="64" y="619" font-size="12.5" fill="#60635e">Det st&#229;r i teksten artisten leser f&#248;r hen velger. Vi lover ikke mer enn vi holder.</text>
</svg>