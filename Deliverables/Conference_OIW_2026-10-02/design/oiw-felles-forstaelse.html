<div id="oiw-design" aria-label="Konferanseløsning – designforslag">
  <style>
    #oiw-design{--oiw-bg:light-dark(#f5f6f3,#141a20);--oiw-paper:light-dark(#fff,#1e2630);--oiw-ink:light-dark(#192d34,#e9f1f2);--oiw-dim:light-dark(#53696e,#acbec3);--oiw-line:light-dark(#dce4e1,#3b4a52);--oiw-brand:light-dark(#154b48,#97d4c7);--oiw-onbrand:light-dark(#fff,#15302c);--oiw-soft:light-dark(#e5f0eb,#243d36);--oiw-warn:light-dark(#835016,#ffcc8a);--oiw-note:light-dark(#fff4dd,#3c3020);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--oiw-ink);background:var(--oiw-bg);border:1px solid var(--oiw-line);border-radius:16px;overflow:hidden}
    #oiw-design *{box-sizing:border-box}#oiw-design button,#oiw-design input,#oiw-design select,#oiw-design textarea{font:inherit}#oiw-design button:disabled{cursor:not-allowed;opacity:.5}#oiw-design h1,#oiw-design h2,#oiw-design h3,#oiw-design p{margin:0}#oiw-design h1{font-size:29px;line-height:1.17;letter-spacing:-.7px;font-weight:650}#oiw-design h2{font-size:19px;font-weight:620}#oiw-design h3{font-size:15px;font-weight:620}#oiw-design .o-top{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;background:var(--oiw-paper);gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--oiw-line)}#oiw-design .o-brand{font-size:19px;letter-spacing:-.6px;font-weight:700;display:flex;align-items:center;gap:10px}#oiw-design .o-monogram{background:var(--oiw-brand);color:var(--oiw-onbrand);border-radius:8px;padding:4px 9px;font-size:18px}#oiw-design .o-kicker{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--oiw-dim);font-weight:650}#oiw-design .o-small{font-size:12px;color:var(--oiw-dim)}#oiw-design .o-subtitle{color:var(--oiw-dim);max-width:650px;margin-top:11px}#oiw-design .o-layout{display:grid;grid-template-columns:174px minmax(0,1fr)}#oiw-design .o-nav{padding:22px 10px;background:var(--oiw-paper);border-right:1px solid var(--oiw-line);display:flex;flex-direction:column;gap:5px}#oiw-design .o-nav button{border:0;background:none;text-align:left;border-radius:7px;padding:11px 12px;color:var(--oiw-dim);display:flex;align-items:center;gap:9px}#oiw-design .o-nav button[aria-selected=true]{color:var(--oiw-brand);background:var(--oiw-soft);font-weight:650}#oiw-design .o-nav i{width:16px;height:16px}#oiw-design .o-nav-foot{margin-top:25px;padding:10px 12px;font-size:11px;color:var(--oiw-dim)}#oiw-design .o-main{padding:26px;min-width:0}#oiw-design .o-head{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;margin-bottom:24px}#oiw-design .o-head .o-kicker{margin-bottom:8px}#oiw-design .o-button{border:1px solid var(--oiw-line);background:var(--oiw-paper);color:var(--oiw-ink);border-radius:8px;padding:9px 13px;white-space:normal;min-height:38px}#oiw-design .o-button.primary{background:var(--oiw-brand);border-color:var(--oiw-brand);color:var(--oiw-onbrand)}#oiw-design .o-button.quiet{border:0;background:transparent;padding-left:0;color:var(--oiw-brand)}#oiw-design .o-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}#oiw-design .o-box{background:var(--oiw-paper);border:1px solid var(--oiw-line);border-radius:12px;padding:18px;min-width:0}#oiw-design .o-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}#oiw-design .o-grid.equal{grid-template-columns:1fr 1fr}#oiw-design .o-stack{display:grid;gap:16px}#oiw-design .o-pill{display:inline-flex;padding:3px 8px;border-radius:5px;background:var(--oiw-soft);color:var(--oiw-brand);font-size:11px;font-weight:600}#oiw-design .o-pill.pending{background:var(--oiw-note);color:var(--oiw-warn)}#oiw-design .o-row{padding:16px 0;border-bottom:1px solid var(--oiw-line)}#oiw-design .o-row:first-child{padding-top:0}#oiw-design .o-row:last-child{border:0;padding-bottom:0}#oiw-design .o-row h3{margin:7px 0}#oiw-design .o-inline{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}#oiw-design .o-labels{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}#oiw-design .o-callout{border-left:3px solid var(--oiw-brand);padding:0 0 0 13px;margin:16px 0;color:var(--oiw-dim)}#oiw-design .o-field{display:grid;gap:6px;min-width:0}#oiw-design .o-field>span{font-size:12px;font-weight:600}#oiw-design input[type=text],#oiw-design input[type=time],#oiw-design input[type=date],#oiw-design input[type=number],#oiw-design select,#oiw-design textarea{width:100%;min-width:0;border:1px solid var(--oiw-line);border-radius:7px;background:var(--oiw-paper);padding:9px 10px;color:var(--oiw-ink)}#oiw-design textarea{resize:vertical;min-height:72px}#oiw-design .o-form{display:grid;gap:16px}#oiw-design .o-check{display:flex;align-items:flex-start;gap:9px;margin:10px 0}#oiw-design input[type=checkbox]{accent-color:var(--oiw-brand);margin-top:4px}#oiw-design .o-divider{height:1px;background:var(--oiw-line);margin:18px 0}#oiw-design .o-meter{height:7px;border-radius:7px;background:var(--oiw-line);overflow:hidden;margin:10px 0}#oiw-design .o-meter>span{display:block;height:100%;background:var(--oiw-brand);transition:width .3s}#oiw-design .o-timeline{display:grid;gap:0;margin-top:15px}#oiw-design .o-step{display:flex;gap:12px;padding:11px 0;align-items:center;color:var(--oiw-dim)}#oiw-design .o-step b{border-radius:50%;width:25px;height:25px;flex-shrink:0;display:grid;place-items:center;border:1px solid var(--oiw-line);font-size:11px}#oiw-design .o-step.done{color:var(--oiw-ink)}#oiw-design .o-step.done b{background:var(--oiw-brand);color:var(--oiw-onbrand);border-color:var(--oiw-brand)}#oiw-design .o-footer{padding:11px 24px;border-top:1px solid var(--oiw-line);background:var(--oiw-paper);font-size:11px;color:var(--oiw-dim);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}#oiw-design .o-avatars{display:flex;gap:7px;align-items:center}#oiw-design .o-avatar{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:var(--oiw-soft);color:var(--oiw-brand);font-weight:600;font-size:11px}#oiw-design .o-notice{margin-bottom:17px;padding:12px 14px;background:var(--oiw-note);border-radius:8px;color:var(--oiw-warn)}#oiw-design .o-empty{padding:35px 20px;text-align:center;background:var(--oiw-paper);border-radius:12px;border:1px solid var(--oiw-line)}#oiw-design .o-empty p{margin:10px 0 18px;color:var(--oiw-dim)}#oiw-design .o-toast{margin-top:16px;padding:11px 14px;border-radius:8px;background:var(--oiw-soft);color:var(--oiw-brand)}#oiw-design .o-table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}#oiw-design .o-table th,#oiw-design .o-table td{padding:10px 5px;border-bottom:1px solid var(--oiw-line);vertical-align:top;overflow-wrap:anywhere}#oiw-design .o-table th{color:var(--oiw-dim);font-weight:500}#oiw-design .o-role{border:1px solid var(--oiw-line);background:var(--oiw-paper);color:var(--oiw-ink);border-radius:18px;padding:5px 10px;font-size:12px}#oiw-design .o-metric{font-size:29px;font-weight:650;letter-spacing:-1px}#oiw-design .o-purpose{background:var(--oiw-soft);border-radius:12px;padding:17px 19px;margin-bottom:21px}#oiw-design .o-purpose h2{margin:5px 0}#oiw-design .o-linkline{display:flex;align-items:center;gap:9px;margin:14px 0;color:var(--oiw-dim);flex-wrap:wrap}#oiw-design [hidden]{display:none!important}@media(max-width:690px){#oiw-design .o-layout{display:block}#oiw-design .o-nav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--oiw-line);padding:9px}#oiw-design .o-nav button{font-size:12px;padding:8px}#oiw-design .o-nav-foot{display:none}#oiw-design .o-main{padding:18px}#oiw-design .o-grid,#oiw-design .o-grid.equal{grid-template-columns:1fr}#oiw-design h1{font-size:25px}#oiw-design .o-head{flex-wrap:wrap}#oiw-design .o-top{padding:14px 18px}#oiw-design input,#oiw-design select,#oiw-design textarea{font-size:16px!important}#oiw-design .o-button{min-height:44px}}@media(prefers-reduced-motion:reduce){#oiw-design *{transition:none!important}}
  </style>
  <header class="o-top"><div class="o-brand"><span class="o-monogram">H</span> HAVEN <span class="o-small">/ OIW som referanse</span></div><span class="o-role" id="o-role-label">Mira · privat deltaker</span></header>
  <div class="o-layout">
    <nav class="o-nav" role="tablist" aria-label="Konferanseflater">
      <button type="button" role="tab" id="o-tab-common" aria-controls="o-content" aria-selected="true" data-view="common"><i data-lucide="sprout" aria-hidden="true"></i>Felles innsikt</button>
      <button type="button" role="tab" id="o-tab-discover" aria-controls="o-content" aria-selected="false" data-view="discover"><i data-lucide="compass" aria-hidden="true"></i>Finn og bidra</button>
      <button type="button" role="tab" id="o-tab-create" aria-controls="o-content" aria-selected="false" data-view="create"><i data-lucide="calendar-plus" aria-hidden="true"></i>Mitt arrangement</button>
      <button type="button" role="tab" id="o-tab-meeting" aria-controls="o-content" aria-selected="false" data-view="meeting"><i data-lucide="messages-square" aria-hidden="true"></i>Møtet vårt</button>
      <button type="button" role="tab" id="o-tab-company" aria-controls="o-content" aria-selected="false" data-view="company"><i data-lucide="building-2" aria-hidden="true"></i>Selskapet</button>
      <button type="button" role="tab" id="o-tab-swarm" aria-controls="o-content" aria-selected="false" data-view="swarm"><i data-lucide="flask-conical" aria-hidden="true"></i>Simulering</button>
      <div class="o-nav-foot">Felles forståelse først.<br>Du velger hva du bidrar med.</div>
    </nav>
    <main class="o-main" id="o-content" role="tabpanel" aria-labelledby="o-tab-common"></main>
  </div>
  <footer class="o-footer"><span>Designforslag · fiktive personer, selskaper og arrangementer</span><span>Ingen nettverkskall, opptak eller publisering</span></footer>
  <script>
    (()=>{
      const root=document.getElementById('oiw-design'),content=root.querySelector('#o-content');
      const state={view:'common',condition:'innhold',density:'luftig',meeting:'samtykke',mine:false,peer:false,shared:false,published:false,audience:'event',purpose:true,experiment:true,transcript:false,step:0,scenario:'normal',toast:''};
      const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const button=(label,action,primary=false,disabled=false)=>`<button type="button" class="o-button cursor-interaction ${primary?'primary':''}" data-action="${action}" ${disabled?'disabled':''}>${label}</button>`;
      const pill=(text,pending=false)=>`<span class="o-pill ${pending?'pending':''}">${text}</span>`;
      const head=(kicker,title,sub,extra='')=>`<div class="o-head"><div><div class="o-kicker">${kicker}</div><h1>${title}</h1><p class="o-subtitle">${sub}</p></div>${extra}</div>`;
      const screens={
        common:()=>head('Paraply / Oslo Innovation Week','Hva kan vi forstå bedre sammen?','Spørsmål, innsikt og uenighet som deltakerne har valgt å dele.',button('Bidra med innsikt','meeting',true))+`
          <div class="o-purpose"><div class="o-kicker">Felles formål</div><h2>Gjøre gode innovasjonsvalg lettere</h2><p class="o-small">Sammenholde erfaringer, utfordre antakelser og finne neste forsøk.</p></div>
          <div class="o-grid"><section class="o-box"><div class="o-inline"><h2>Spørsmål som trenger oss</h2>${pill('Eksempeldata')}</div><div class="o-divider"></div>
            <div class="o-row">${pill('Åpent spørsmål')}<h3>Hva gjør en sirkulær pilot levedyktig etter støtteperioden?</h3><p class="o-small">To arrangementer bidrar med erfaringer. Kostnad ved retur er fortsatt uavklart.</p><div class="o-labels">${pill('Sirkularitet')}${pill('Pilotdesign')}</div>${button('Se argumenter og kilder','claim')}</div>
            <div class="o-row">${pill('Ulike syn',true)}<h3>Felles data kan hjelpe — men hvilke må forbli lokale?</h3><p class="o-small">Innsikten inneholder både felles konklusjoner og et begrunnet mindretallssyn.</p>${button('Utforsk uenigheten','claim')}</div></section>
          <aside class="o-stack"><section class="o-box"><div class="o-kicker">Sist delt fra et møte</div><h3 style="margin-top:8px">Test returordningen i liten skala</h3><p class="o-subtitle">Et felles forslag, knyttet til møtets godkjente versjon og kilder.</p><div class="o-divider"></div><div class="o-avatars"><span class="o-avatar">M</span><span class="o-avatar">J</span><span class="o-small">Begge godkjente utdraget</span></div>${button('Se hva som ble delt','meeting')}</section><section class="o-box"><div class="o-kicker">Til min entitet</div><p style="margin-top:8px">Velg hvilke innsikter du vil ta med videre.</p>${button('Gjennomgå mine valg','personal')}</section></aside></div>`,
        discover:()=>head('Match formål, bidrag og tid','Finn et sted å bidra','Du ser hvorfor noe passer. Et treff er en invitasjon til å vurdere — ingen tilgang eller automatisk påmelding.')+`
          <div class="o-grid equal" style="margin-bottom:18px"><label class="o-field"><span>Jeg ønsker å bidra til</span><select id="o-interest"><option>Sirkulære forretningsmodeller</option><option>Ansvarlig bruk av AI</option><option>Åpne innovasjonsprosesser</option></select></label><label class="o-field"><span>Når kan jeg møtes?</span><select id="o-time"><option>Tirsdag 13:00–15:00</option><option>Vis alle tidspunkt</option></select></label></div>
          <section class="o-box"><div class="o-row"><div class="o-inline">${pill('Felles formål')}${pill('Søker erfaring fra pilot')}</div><h2 style="margin-top:10px" id="o-match-title">Fra sirkulær idé til første pilot</h2><p class="o-small">Tirsdag 13:00–14:00 · Fjordlab · 8 ledige plasser · fysisk + digitalt</p><p class="o-callout" id="o-match-why">Passer fordi du tilbyr erfaring med innkjøp, og arrangementet trenger nettopp dette. Tiden overlapper din delte tilgjengelighet.</p><div class="o-inline"><span class="o-small">Uavhengig HAVEN-arrangement · OIW-tilknytning ikke bekreftet</span>${button('Vurder arrangement','event',true)}</div></div>
          <div class="o-row"><div class="o-inline"><h3>Jonas tilbyr 20 minutter om måling av materialbruk</h3>${pill('Tilgjengelig 14:15')}</div><p class="o-small">Jonas har selv delt tema og tidsrom. Privat kalender og kontaktinformasjon er skjult.</p>${button('Foreslå et møte','meeting')}</div></section><p class="o-small" style="margin-top:14px">Ingen ledige treff? Opprett et åpent spørsmål eller et eget arrangement.</p>`,
        create:()=>head('Arrangør / utkast','Gi arrangementet et formål','Publiser det dere vil oppnå, hva dere kan bidra med og hvem dere trenger — med tid og tilgjengelighet.')+`
          <div class="o-grid"><form class="o-box o-form" id="o-event-form"><label class="o-field"><span>Navn</span><input type="text" id="o-event-name" value="Fra sirkulær idé til første pilot" required></label><label class="o-field"><span>Hva skal bli mulig etterpå?</span><textarea id="o-event-purpose" required>Enes om ett lite forsøk som viser om retur av materialer lønner seg.</textarea></label><div class="o-grid equal"><label class="o-field"><span>Dato</span><input type="date" value="2026-10-20"></label><label class="o-field"><span>Starter</span><input type="time" value="13:00"></label></div><div class="o-grid equal"><label class="o-field"><span>Plasser</span><input type="number" min="1" value="20"></label><label class="o-field"><span>Deltakelse</span><select><option>Fysisk + digitalt</option><option>Fysisk</option><option>Digitalt</option></select></label></div><label class="o-field"><span>Sted / tilgjengelighet</span><input type="text" value="Fjordlab · trinnfri inngang · norsk og engelsk"></label><label class="o-field"><span>Vi tilbyr / vi trenger</span><textarea>Tilbyr: erfaring fra en pilot. Trenger: innkjøper, materialkunnskap og kritiske spørsmål.</textarea></label><div class="o-actions">${button('Lagre utkast','save-event',true)}${button('Forhåndsvis','preview-event')}</div></form>
          <aside class="o-stack"><section class="o-box"><h3>DiMy-rådgivere</h3><p class="o-subtitle">Gjør hensikten konkret og finn antakelsene dere bør prøve.</p>${button('Bryt ned formålet','advisor-purpose')}${button('Utfordre argumentene','advisor-claims')}<div id="o-advisor-result" class="o-small" aria-live="polite"></div></section><section class="o-box"><h3>Synlighet og tilknytning</h3><div class="o-divider"></div><label class="o-check"><input type="checkbox" checked><span>Gjør arrangementets formål og ledige plasser søkbare i HAVEN.</span></label><p class="o-small">Offisiell OIW-tilknytning er en separat godkjenning.</p><div class="o-labels">${pill('Utkast')}${pill('OIW ikke bekreftet',true)}</div></section></aside></div>`,
        meeting:()=>{
          let inner='';
          if(state.meeting==='samtykke')inner=`<div class="o-notice">Nærhet oppretter ingen rettigheter. Et møte og et opptak krever egne valg.</div><div class="o-grid"><section class="o-box"><div class="o-inline"><h2>Er vi enige om rammene?</h2>${pill('Opptak er av',true)}</div><p class="o-subtitle">Samtale om returordninger. Bare oss to får utkastet. Deling til arrangementet velges senere.</p><div class="o-divider"></div><label class="o-check"><input type="checkbox" id="o-mine" ${state.mine?'checked':''}><span>Jeg godtar opptak og transkripsjon for dette møtet.<br><span class="o-small">Mira · mitt valg</span></span></label><div class="o-inline" style="margin:16px 0"><span>Jonas</span>${pill(state.peer?'Har godkjent':'Avventer eget samtykke',!state.peer)}</div><p class="o-small">Foreslåtte rammer: transkripsjon på opptakerenheten, ingen ekstern AI-tjeneste, ingen varig lydfil. Utkast slettes etter 7 dager. Alle kan stoppe; ny deltaker utløser pause. Rammene må bekreftes før en virkelig økt.</p><div class="o-actions" style="margin-top:18px">${button('Start opptak','record',true,!(state.mine&&state.peer))}${button('Fortsett uten opptak','no-record')}</div></section><aside class="o-box"><div class="o-kicker">Nearby i Binding</div><h3 style="margin-top:10px">Mira ↔ Jonas</h3><p class="o-subtitle">Begge har valgt å delta i samme møte.</p><div class="o-divider"></div><p class="o-small">På web: bli med via møtelenke eller QR. Bluetooth-radar vises bare der den finnes.</p><div class="o-divider"></div>${button(state.peer?'Vis ventende motpart':'Simuler Jonas sitt samtykke','peer')}<p class="o-small">Kun kontroll av eksempelscenarioet.</p></aside></div>`;
          else if(state.meeting==='opptak')inner=`<section class="o-box"><div class="o-inline"><h2>Opptak pågår · eksempel</h2>${pill('Mira + Jonas har samtykket')}</div><p class="o-subtitle">Ingen mikrofon er aktiv i denne skissen.</p><div class="o-callout">Felles hensikt: finne et lite forsøk vi begge vil bidra til.</div><div class="o-actions">${button('Stopp og gjennomgå','review',true)}${button('Ny deltaker → pause','pause')}</div></section>`;
          else inner=`<div class="o-grid"><section class="o-box"><div class="o-inline"><h2>Velg det som er felles</h2>${pill('Versjon 3 · utkast',true)}</div><p class="o-small" style="margin-top:9px">Transkripsjon er en kilde. Forslag fra AI må kontrolleres.</p><div class="o-divider"></div><label class="o-check"><input type="checkbox" data-excerpt="purpose"><span><strong>Felles formål</strong><br>Prøve en returordning for én materialstrøm.</span></label><label class="o-check"><input type="checkbox" data-excerpt="experiment"><span><strong>Neste forsøk</strong><br>Sammenligne transportkostnad og materialverdi i to uker.</span></label><label class="o-check"><input type="checkbox" data-excerpt="transcript"><span><strong>Hele transkripsjonen</strong><br><span class="o-small">Blir hos møtedeltakerne med mindre den velges og godkjennes særskilt.</span></span></label><div class="o-divider"></div><p class="o-small">Uenighet bevares: Jonas mener volumet er for lite. Mira foreslår at nettopp det testes.</p></section><aside class="o-stack"><section class="o-box"><label class="o-field"><span>Hvem skal få valgt utdrag?</span><select id="o-audience"><option value="event">Dette arrangementet</option><option value="umbrella">Paraplyens fellesskap</option><option value="meeting">Bare oss to</option></select></label><label class="o-check"><input type="checkbox" id="o-final-approval" ${state.shared?'checked':''}><span>Simuler at begge godkjenner denne versjonen og mottakeren.</span></label>${button(state.published?'Delt i eksempelscenarioet':'Del godkjent utdrag','share',true,!state.shared||state.published||!(state.purpose||state.experiment||state.transcript))}<p class="o-small" style="margin-top:10px">En innholdsendring eller ny mottaker krever ny godkjenning.</p></section><section class="o-box"><h3>Til min entitet</h3><p class="o-small">Mine private notater følger ikke med fellesutdraget.</p>${button('Velg hva jeg beholder','personal')}</section></aside></div>`;
          return head('Møte / valgt av deltakerne','Fra møte til felles innsikt','Opptak, bearbeiding, deling og egne notater er separate valg.')+inner;
        },
        company:()=>head('Gruppeentitet / eksempel','Fjordlab','Selskapet har egne formål, bidrag og fullmakter. Ansattes private entiteter forblir deres egne.',pill('Jeg handler som Mira'))+`
          <div class="o-grid"><section class="o-box"><div class="o-kicker">Selskapets formål</div><h2 style="margin-top:8px">Gjøre materialer brukbare igjen</h2><p class="o-subtitle">Søker pilotpartnere. Tilbyr materialkunnskap, verksted og tid til et felles forsøk.</p><div class="o-divider"></div><h3>Hvilken hatt bruker jeg?</h3><label class="o-field" style="margin-top:10px"><span>Representasjon i arrangementet</span><select id="o-representation"><option value="private">Mira som privatperson</option><option value="company">Mira på vegne av Fjordlab</option></select></label><p class="o-callout" id="o-authority">Privat valg. Du publiserer ikke på vegne av selskapet.</p><h3>Bidrag som kan deles</h3><div class="o-row"><p>Rapport fra materialforsøk</p><p class="o-small">Fjordlab eier dokumentet · godkjent for arrangementet</p></div><div class="o-row"><p>Mira sine møtenotater</p><p class="o-small">Private · ikke del av selskapsentiteten</p></div></section>
          <aside class="o-stack"><section class="o-box"><h3>Roller og fullmakter</h3><table class="o-table"><thead><tr><th>Medlem</th><th>Kan gjøre</th></tr></thead><tbody><tr><td>Mira</td><td>Arrangere og sende møteforslag</td></tr><tr><td>Jonas</td><td>Godkjenne selskapsbidrag</td></tr></tbody></table><p class="o-small" style="margin-top:12px">Fullmakt har omfang, utløp og tilbakekalling. Medlemskap gir ikke innsyn i private notater.</p>${button('Se en fullmakt','mandate')}</section><section class="o-box"><h3>Bekreftelse av selskapet</h3><p class="o-small" style="margin-top:8px">Organisasjonsnummer kan verifisere virksomheten. Rett til å representere den må bevises separat.</p><div class="o-labels">${pill('Illustrasjon · ikke verifisert',true)}</div></section></aside></div>`,
        swarm:()=>{
          const labels=['Opprett paraply, arrangementer og syntetiske aktører','Publiser avgrensede formål og tilgjengelighet','Finn match og be om et møte','Prøv samtykke, avslag og tilbakekalling','Del godkjent utdrag; behold private notater','Kontroller proveniens og levering mellom scaffolds'];
          const stopped=state.scenario==='revocation'&&state.step>=4;
          return head('Swarm / foreslått operatørflate','Prøv samspillet før mennesker inviteres','Scenarioforhåndsvisning. Ingen swarm-kjøring er startet fra denne skissen.')+`
          <div class="o-notice">Eksisterende swarm har kjøre-API. Denne samlede OIW-flaten og de semantiske aktørene er foreslått funksjonalitet.</div><div class="o-grid"><section class="o-box"><label class="o-field"><span>Scenario</span><select id="o-scenario"><option value="normal" ${state.scenario==='normal'?'selected':''}>Samarbeid med avgrenset deling</option><option value="revocation" ${state.scenario==='revocation'?'selected':''}>En deltaker trekker tilbake før publisering</option><option value="offline" ${state.scenario==='offline'?'selected':''}>Et mottakerscaffold blir utilgjengelig</option></select></label><div class="o-timeline">${labels.map((x,i)=>`<div class="o-step ${i<state.step?'done':''}"><b>${i<state.step?'✓':i+1}</b><span>${x}</span></div>`).join('')}</div><div class="o-actions" style="margin-top:15px">${button('Neste simulerte steg','step',true,state.step===6)}${button('Start skissen på nytt','reset-sim')}</div></section><aside class="o-stack"><section class="o-box"><div class="o-kicker">Foreslått lite scenario</div><h3 style="margin-top:8px">12 personer · 3 selskaper</h3><p class="o-small">1 paraply · 4 arrangementer · 3 scaffold-verter · fast seed</p><div class="o-divider"></div><div class="o-inline"><span>Gjennomgått i skissen</span><span>${state.step} / 6</span></div><div class="o-meter"><span style="width:${state.step/6*100}%"></span></div><p class="o-small">Tallene beskriver testoppsettet, ikke målte resultater.</p></section><section class="o-box" aria-live="polite"><h3>${stopped?'Publisering skal avvises':state.scenario==='offline'&&state.step>=5?'Venter på mottakeren':'Neste forventning'}</h3><p class="o-subtitle">${stopped?'Tilbakekalt godkjenning stopper fellesutdraget. Privat informasjon skal ikke dukke opp i paraplyen.':state.scenario==='offline'&&state.step>=5?'Vis ventende status. Gjenforsøk skal ikke skape duplikater, og avsenders data skal beholdes.':state.step===6?'Kjør backendtesten for å få et faktisk resultat. At denne illustrasjonen går gjennom, er ikke et testbevis.':labels[state.step]}</p></section></aside></div>`;
        }
      };
      function navigate(view){state.view=view;state.toast='';render()}
      function render(){
        root.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.view===state.view)));
        content.setAttribute('aria-labelledby','o-tab-'+state.view);
        root.querySelector('#o-role-label').textContent=state.view==='swarm'?'Operatør · testmiljø':state.view==='create'?'Mira · arrangør':'Mira · privat deltaker';
        content.style.padding=state.density==='kompakt'?'18px':'26px';
        content.innerHTML=screens[state.view]();
        if(state.condition!=='innhold'){
          const title=state.condition==='tomt'?'Her kan det første bidraget komme':'Denne delen er utilgjengelig akkurat nå';
          content.innerHTML=head('Tilstand / '+state.view,title,state.condition==='tomt'?'Ingen data er skjult bak en tom liste. Det finnes en tydelig vei videre.':'Det du har lagret beholdes. Du kan fortsette i de delene som er tilgjengelige.')+`<section class="o-empty"><h2>${state.condition==='tomt'?'Start med ett formål':'Vi har ikke mottatt et svar'}</h2><p>${state.condition==='tomt'?'Beskriv noe du vil forstå, bidra med eller prøve sammen med andre.':'Ingen handling er bekreftet. Kontroller tilstanden før du prøver igjen.'}</p>${button(state.condition==='tomt'?'Vis et første utkast':'Prøv igjen i skissen','restore',true)}</section>`;
        }
        if(state.toast)content.insertAdjacentHTML('beforeend',`<div class="o-toast" role="status">${esc(state.toast)}</div>`);
        bind();if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
      }
      function tell(text){state.toast=text;render()}
      function bind(){
        content.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.action)));
        const mine=content.querySelector('#o-mine');if(mine)mine.onchange=()=>{state.mine=mine.checked;render()};
        const approve=content.querySelector('#o-final-approval');if(approve)approve.onchange=()=>{state.shared=approve.checked;render()};
        const aud=content.querySelector('#o-audience');if(aud){aud.value=state.audience;aud.onchange=()=>{state.audience=aud.value;state.shared=false;state.published=false;tell('Ny mottaker valgt. Begge må godkjenne på nytt.');};}
        content.querySelectorAll('[data-excerpt]').forEach(input=>{input.checked=state[input.dataset.excerpt];input.onchange=()=>{state[input.dataset.excerpt]=input.checked;state.shared=false;state.published=false;tell('Utdraget er endret. Begge må godkjenne den nye versjonen.');};});
        const scenario=content.querySelector('#o-scenario');if(scenario)scenario.onchange=()=>{state.scenario=scenario.value;state.step=0;render()};
        const role=content.querySelector('#o-representation');if(role)role.onchange=()=>{content.querySelector('#o-authority').textContent=role.value==='company'?'Foreslått fullmakt: arrangere møter for Fjordlab. Publisere rapporter krever egen rettighet.':'Privat valg. Du publiserer ikke på vegne av selskapet.';};
        const interest=content.querySelector('#o-interest'),time=content.querySelector('#o-time');
        const match=()=>{const found=interest.value==='Sirkulære forretningsmodeller';content.querySelector('#o-match-title').textContent=found?'Fra sirkulær idé til første pilot':'Ingen bekreftede treff i dette eksempeldatasettet';content.querySelector('[data-action="event"]').disabled=!found;content.querySelector('#o-match-why').textContent=found?'Felles formål: sirkulære materialstrømmer. Du tilbyr erfaring med innkjøp. '+(time.selectedIndex===0?'Tiden overlapper din delte tilgjengelighet.':'Alle tidspunkt vises; avtal tid før du bekrefter.'):'Ingen publiserte formål passer dette valget i eksempelet. Du kan opprette et eget arrangement.';};
        if(interest)interest.onchange=match;if(time)time.onchange=match;
        const form=content.querySelector('#o-event-form');if(form)form.onsubmit=e=>e.preventDefault();
      }
      function act(action){
        if(screens[action])return navigate(action);
        if(action==='peer'){state.peer=!state.peer;return render()}
        if(action==='record'){if(state.mine&&state.peer){state.meeting='opptak';render()}return}
        if(action==='review'||action==='no-record'){state.meeting='gjennomgang';return render()}
        if(action==='pause'){state.meeting='samtykke';state.peer=false;state.mine=false;return tell('Opptak stoppet i skissen. Den nye deltakerlisten må godkjenne rammene.')}
        if(action==='share'){if(state.shared&&(state.purpose||state.experiment||state.transcript)){state.published=true;tell('Valgt utdrag er markert delt i skissen. Ingen virkelige data er sendt.')}return}
        if(action==='step'){state.step=Math.min(6,state.step+1);return render()}
        if(action==='reset-sim'){state.step=0;return render()}
        if(action==='restore'){state.condition='innhold';return render()}
        if(action==='save-event'||action==='preview-event'){
          const name=content.querySelector('#o-event-name'),purpose=content.querySelector('#o-event-purpose');
          if(!name.value.trim()||!purpose.value.trim()){name.reportValidity();purpose.reportValidity();return}
          const message=action==='save-event'?'Utkastet er illustrert som lagret. Ingen offisiell OIW-søknad er sendt.':'Forhåndsvisning: '+name.value+' — '+purpose.value;
          let old=content.querySelector('.o-toast');if(old)old.remove();content.insertAdjacentHTML('beforeend',`<div class="o-toast" role="status">${esc(message)}</div>`);return;
        }
        if(action==='advisor-purpose'||action==='advisor-claims'){
          content.querySelector('#o-advisor-result').innerHTML=action==='advisor-purpose'?'<div class="o-callout"><strong>Illustrert rådgiverforslag</strong><br>1. Beskriv materialstrømmen.<br>2. Finn pilotpartneren.<br>3. Mål returkostnad før dere skalerer.<br>Du godkjenner formål og mål.</div>':'<div class="o-callout"><strong>Illustrert argumentanalyse</strong><br>Påstand: returordningen lønner seg.<br>Mangler: volum og transportkostnad.<br>Motargument: små volumer kan spise opp gevinsten.<br>Status: ikke avgjort.</div>';return;
        }
        const messages={claim:'Kildevisning i forslaget: påstand → evidens → motargument → åpent spørsmål. Ingen poengsum på mennesker.',personal:'Forslag: velg utdrag og egen hensikt før det lagres i din entitet. Felles publisering følger ikke automatisk.',event:'Forslag: se kapasitet, påmeldingskrav, tilgjengelighet og hvorfor treffet ble foreslått før du melder deg på.',mandate:'Foreslått fullmakt: avsender, mottaker, handling, ressurs, tidsrom, delegasjonsgrense og tilbakekalling.'};
        tell(messages[action]||'Denne handlingen er bare vist som design.');
      }
      root.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.view)));
      function restore(saved){const p=saved?.privateContent;if(!p)return false;const before=JSON.stringify([state.view,state.density,state.scenario,state.step]);if(screens[p.view])state.view=p.view;if(['luftig','kompakt'].includes(p.density))state.density=p.density;if(['normal','revocation','offline'].includes(p.scenario))state.scenario=p.scenario;if(Number.isInteger(p.step)&&p.step>=0&&p.step<=6)state.step=p.step;return before!==JSON.stringify([state.view,state.density,state.scenario,state.step]);}
      function remember(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{view:state.view,scenario:state.scenario,prototypeOnly:true},privateContent:{view:state.view,density:state.density,scenario:state.scenario,step:state.step}}).catch(()=>{});}
      restore(window.openai?.widgetState);
      window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState&&restore(e.detail.globals.widgetState))render();});
      root.addEventListener('click',()=>queueMicrotask(remember));root.addEventListener('change',()=>queueMicrotask(remember));
      render();
      if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(state,'condition',{label:'Vis tilstand',options:[{label:'Med innhold',value:'innhold'},{label:'Tomt',value:'tomt'},{label:'Utilgjengelig',value:'feil'}]});tweak.addSelect(state,'density',{label:'Tetthet',options:['luftig','kompakt']});tweak.addSelect(state,'meeting',{label:'Møtetilstand',options:['samtykke','opptak','gjennomgang']});}
    })();
  </script>
</div>
