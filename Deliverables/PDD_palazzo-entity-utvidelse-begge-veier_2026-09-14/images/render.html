<!doctype html><html lang="no"><head><meta charset="utf-8">
<title>Koble-flaten — mockups (PDD_palazzo-entity-utvidelse-begge-veier_2026-09-14)</title>
<style>
@font-face{font-family:"Jost";src:url(jost-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Jost";src:url(jost-latin-500-normal.woff2) format("woff2");font-weight:500}
@font-face{font-family:"Jost";src:url(jost-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:"Playfair Display";src:url(playfair-display-latin-500-normal.woff2) format("woff2");font-weight:500}
@font-face{font-family:"Playfair Display";src:url(playfair-display-latin-600-normal.woff2) format("woff2");font-weight:600}
:root{--olive:#556b3f;--terra:#832c03;--sand:#dacab9;--yellow:#f0bd41;--navy:#213963;--cold:#e6eaf0;--paper:#f8f5f2;--ink:#2b2b2b;--muted:#5c5c5c}
html,body{margin:0;background:#666;color:var(--ink);font-family:"Jost",Futura,"Century Gothic",sans-serif;font-size:15px;line-height:1.38}
.phone{width:390px;height:844px;background:var(--paper);position:relative;overflow:hidden;margin:0}
.topbar{display:flex;justify-content:space-between;font-size:12px;padding:10px 18px 0;color:#777}
.hero{background:var(--olive);color:var(--paper);padding:14px 18px 14px;display:flex;align-items:center;gap:12px}
.hero img.logo{width:190px;height:auto;display:block}
.hero img.bird{width:44px;height:auto;margin-left:auto;opacity:.95}
.hero .sub{font-size:12px;opacity:.9;margin-top:2px}
.pad{padding:16px 18px}
.section{margin-bottom:18px}
.section>h2{font-family:"Playfair Display","Noe Display",Georgia,serif;font-weight:600;color:var(--olive);font-size:20px;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--olive);box-shadow:0 2px 0 var(--paper),0 3px 0 var(--olive)}
.card{background:#fff;border:1px solid var(--sand);border-radius:12px;padding:12px}
.card.cold{background:var(--cold);color:var(--navy);border:0;border-left:4px solid var(--navy)}
.card.cold .cap{color:var(--navy)}
.card.ok{background:#eef3e6;border:0;border-left:4px solid var(--olive)}
.hl{font-weight:600;font-size:16px;color:var(--olive)}
.cap{font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-size:15px;font-weight:500;padding:11px 14px;border-radius:999px;border:1.5px solid var(--olive);background:transparent;color:var(--olive);display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.primary{background:var(--olive);color:var(--paper);width:100%;font-size:16px;font-weight:600;padding:14px}
.btn.quiet{border-color:transparent;color:var(--muted);padding:8px 10px}
.btn.danger{border-color:var(--terra);color:var(--terra)}
.link{color:var(--olive);text-decoration:underline;text-underline-offset:3px}
hr{border:0;border-top:1px solid var(--sand);margin:6px 0}
.backdrop{position:absolute;inset:0;background:rgba(43,43,43,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.22);padding:14px 18px 20px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--sand);margin:0 auto 12px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);font-weight:600;display:flex;align-items:center;gap:6px}
.seal{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--olive);position:relative}
.seal:after{content:"";position:absolute;left:4px;top:1.5px;width:4px;height:8px;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg)}
.title{font-family:"Playfair Display",Georgia,serif;font-size:26px;line-height:1.15;color:var(--olive);margin:6px 0 10px;font-weight:600}
.lines p{margin:0 0 8px}
.who{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--sand);border-radius:12px;padding:10px;margin:6px 0 10px}
.who .av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}
.who .av.p{background:var(--olive)}
.who .lnk{font-size:22px;color:var(--olive);margin:0 2px}
.who .nm{font-weight:600}
.who .dm{font-size:12px;color:var(--muted)}
.proof{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);margin:8px 0 12px}
.proof .k{width:16px;height:16px;border-radius:4px;background:var(--cold);flex:0 0 16px;position:relative}
.proof .k:after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid var(--navy);border-width:0 2px 2px 0;transform:rotate(45deg)}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.actions .secondary{display:flex;justify-content:space-between;align-items:center}
.expander{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--sand);color:var(--olive);font-weight:500}
.expander .chev{font-size:18px;color:var(--olive)}
.explain{background:#fff;border:1px solid var(--sand);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.explain p{margin:0 0 6px;font-size:13.5px}
.explain b{color:var(--olive)}
.code{font-family:"Jost",monospace;font-size:30px;letter-spacing:.14em;text-align:center;background:#fff;border:1.5px dashed var(--olive);border-radius:12px;padding:14px;margin:10px 0;color:var(--olive);font-weight:600}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--sand);border-top-color:var(--olive);border-radius:50%;margin-right:8px;vertical-align:-2px}
.haven .hero{background:var(--navy)}
.haven .section>h2{color:var(--navy);border-color:var(--navy);box-shadow:0 2px 0 var(--paper),0 3px 0 var(--navy)}
.haven .title{color:var(--navy)}
.haven .btn{border-color:var(--navy);color:var(--navy)}
.haven .btn.primary{background:var(--navy);color:#fff}
.haven .eyebrow{color:var(--navy)}
.haven .link{color:var(--navy)}
.haven .hl{color:var(--navy)}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--cold);color:var(--navy);font-weight:500}
</style></head><body>
<div id="root"></div>
<script>
const params=new URLSearchParams(location.search);const view=params.get('view')||'tilbud';
function el(t,c,html){const e=document.createElement(t);if(c)e.className=c;if(html!=null)e.innerHTML=html;return e}
function phone(cls){const p=el('div','phone'+(cls?' '+cls:''));p.appendChild(el('div','topbar','<span>20:41</span><span>●●● ▲ 🔋</span>'));return p}
function heroPalazzo(){const h=el('div','hero');h.innerHTML='<div><img class="logo" src="logotype-yellow.png" alt="Palazzo Comunale"><div class="sub">cibo, vino e libertà · Grünerløkka, Oslo</div></div><img class="bird" src="bird-cream.png" alt="">';return h}
function heroHaven(){const h=el('div','hero');h.innerHTML='<div><div style="font-family:\'Playfair Display\',Georgia,serif;font-size:24px;color:#fff;letter-spacing:.3px">HAVEN</div><div class="sub">Kjetil H. · din entitet</div></div><span class="pill" style="margin-left:auto;background:#fff;color:#213963">Palazzo · over bro</span>';return h}
function guestBody(opts){
  opts=opts||{};
  const pad=el('div','pad');
  // Seksjon: Fra huset
  const s1=el('div','section');s1.appendChild(el('h2',null,'Fra huset'));
  const c1=el('div','card');c1.innerHTML='<div class="hl">Kvelden hos Palazzo</div><div>Bord 7 · kl. 19.30 · to personer</div><div class="cap">Bekreftet av huset</div>';s1.appendChild(c1);pad.appendChild(s1);
  // Seksjon: Koblinger / Delt med Palazzo
  const s2=el('div','section');s2.appendChild(el('h2',null,'Delt med Palazzo'));
  const c2=el('div','card cold');c2.innerHTML='<div class="hl" style="color:#213963">Én linje, signert av deg</div><div>«Pistasj fra Bronte — vil smake»</div><div class="cap">Trekk tilbake når som helst</div>';s2.appendChild(c2);
  if(opts.linkedCard){const c3=el('div','card ok');c3.style.marginTop='10px';c3.innerHTML='<div class="row" style="justify-content:space-between"><div class="hl">Koblet til HAVEN ✓</div><span class="cap">i dag 20:41</span></div><div>Palazzo kjenner deg igjen i HAVEN. Huset fikk ingen nye innsynsrettigheter — samtykkene dine gjelder som før.</div><div class="row" style="margin-top:10px"><button class="btn quiet">Koble fra</button><span class="link" style="margin-left:auto;font-size:14px">Se koblinger</span></div>';s2.appendChild(c3)}
  if(opts.declinedLine){const c3=el('div','card');c3.style.marginTop='10px';c3.innerHTML='<div class="row" style="justify-content:space-between"><div><div class="hl" style="font-size:15px">Kobling til HAVEN</div><div class="cap">Avslått 14. sept. — vi spør ikke igjen</div></div><span class="link" style="font-size:14px">Endre</span></div>';s2.appendChild(c3)}
  pad.appendChild(s2);
  // Seksjon: Sicilia
  const s3=el('div','section');s3.appendChild(el('h2',null,'Sicilia — små artikler'));
  const c4=el('div','card');c4.innerHTML='<div class="hl">Pistasj fra Bronte — det grønne gullet under Etna</div><div class="cap">Bronte, Etna · 2 min</div>';s3.appendChild(c4);pad.appendChild(s3);
  return pad;
}
function sheetOffer(opts){
  opts=opts||{};
  const b=el('div','backdrop');const s=el('div','sheet');
  s.appendChild(el('div','grab'));
  s.appendChild(el('div','eyebrow','<span class="seal"></span> Palazzo Comunale · bekreftet hus'));
  s.appendChild(el('div','title','Er dette deg i HAVEN?'));
  const who=el('div','who');who.innerHTML='<div class="av p">P</div><div><div class="nm">Gjest hos Palazzo</div><div class="dm">gjest · palazzo.digipomps.org</div></div><span class="lnk">⇄</span><div class="av">K</div><div><div class="nm">Kjetil H.</div><div class="dm">HAVEN-identitet · på denne telefonen</div></div>';
  s.appendChild(who);
  const lines=el('div','lines');lines.innerHTML='<p>Palazzo bekrefter gjesten din på sin server, HAVEN-appen bekrefter deg. <b>Ett trykk</b> kobler dem — du bekrefter med Face ID.</p><p>Innholdet ditt blir liggende der det er. HAVEN får den tilgangen til Palazzo-dataene dine som du velger; huset får ingen nye innsynsrettigheter.</p>';
  s.appendChild(lines);
  const pr=el('div','proof');pr.innerHTML='<span class="k"></span><span>Koblingen lagres i gjesteankeret ditt hos Palazzo, med kvittering i HAVEN. Kan kobles fra når som helst under Koblinger.</span>';
  s.appendChild(pr);
  if(opts.explained){const ex=el('div','explain');ex.innerHTML='<p><b>Hva er koblingen?</b> Gjesteidentiteten din (oppbevart hos Palazzo) og HAVEN-identiteten din (oppbevart der HAVEN-appen din er) signerer hver sin del av samme kobling.</p><p><b>Hva endrer seg?</b> HAVEN-identiteten din får den tilgangen til Palazzo-dataene dine som du velger, og Palazzo kjenner deg igjen når du kommer fra HAVEN.</p><p><b>Hva endrer seg ikke?</b> Hva huset får spørre om. Det styres av samtykkene dine, som før.</p><p><b>Koble fra?</b> Ja, når som helst. Koblingens tilgang stopper med én gang; historikken beholdes.</p>';s.appendChild(ex)}
  const act=el('div','actions');
  act.appendChild(el('button','btn primary','⇄ Koble — ett trykk'));
  const sec=el('div','secondary');sec.innerHTML='<button class="btn quiet">Ikke nå</button><span class="link" style="font-size:14px;color:#5c5c5c">Aldri for Palazzo</span>';act.appendChild(sec);
  s.appendChild(act);
  const exp=el('div','expander','<span>Hva betyr dette?</span><span class="chev">'+(opts.explained?'⌃':'⌄')+'</span>');
  s.appendChild(exp);
  return [b,s];
}
function sheetWaiting(){
  const b=el('div','backdrop');const s=el('div','sheet');
  s.appendChild(el('div','grab'));
  s.appendChild(el('div','eyebrow','<span class="seal"></span> Palazzo Comunale · bekreftet hus'));
  s.appendChild(el('div','title','Godkjenn i HAVEN-appen'));
  const lines=el('div','lines');lines.innerHTML='<p>HAVEN-identiteten din er på en annen enhet. Åpne HAVEN der, skann eller skriv inn koden, og bekreft at det er Palazzo Comunale du kobler til.</p>';s.appendChild(lines);
  s.appendChild(el('div','code','4F7K‑PZ'));
  s.appendChild(el('div','cap','<span class="spin"></span>Venter … koblingen fullføres når du har bekreftet i HAVEN. Koden gjelder i 10 minutter og kan bare brukes én gang.'));
  const act=el('div','actions');act.style.marginTop='14px';const sec=el('div','secondary');sec.innerHTML='<button class="btn quiet">Avbryt</button><span class="cap">Ingenting er koblet ennå</span>';act.appendChild(sec);s.appendChild(act);
  return [b,s];
}
function havenBody(){
  const pad=el('div','pad');
  const s1=el('div','section');s1.appendChild(el('h2',null,'Entiteten din'));
  const c1=el('div','card');c1.innerHTML='<div class="hl">Formål og interesser</div><div>3 aktive formål · 12 interesser</div>';s1.appendChild(c1);pad.appendChild(s1);
  const s2=el('div','section');s2.appendChild(el('h2',null,'Palazzo Comunale'));
  const c2=el('div','card');c2.innerHTML='<div class="hl">Gjesteflaten</div><div class="cap">Åpnet over bro · palazzo.digipomps.org</div>';s2.appendChild(c2);pad.appendChild(s2);
  return pad;
}
function sheetHaven(){
  const b=el('div','backdrop');const s=el('div','sheet');
  s.appendChild(el('div','grab'));
  s.appendChild(el('div','eyebrow','<span class="seal" style="background:#213963"></span> HAVEN · bekreftet: palazzo.digipomps.org'));
  s.appendChild(el('div','title','Palazzo vil kjenne deg igjen'));
  const who=el('div','who');who.innerHTML='<div class="av">K</div><div><div class="nm">Kjetil H.</div><div class="dm">din HAVEN-identitet</div></div><span class="lnk" style="color:#213963">⇄</span><div class="av p">P</div><div><div class="nm">Gjest hos Palazzo</div><div class="dm">ny · lages i Palazzos domene</div></div>';
  s.appendChild(who);
  const lines=el('div','lines');lines.innerHTML='<p>Du åpnet Palazzos flate med HAVEN-identiteten din. <b>Ett trykk</b> lager en gjesteprofil hos Palazzo for akkurat denne identiteten — ingen ny identitet, ingen kopi av entiteten din.</p><p>Palazzo får ikke se entiteten din. Alt huset kan spørre om, gir du innsyn til selv — som ellers.</p>';
  s.appendChild(lines);
  const pr=el('div','proof');pr.innerHTML='<span class="k"></span><span>Du bekrefter med Face ID. Gjesteprofilen lagres hos Palazzo, kvitteringen i entiteten din. Kan kobles fra under Koblinger.</span>';
  s.appendChild(pr);
  const act=el('div','actions');act.appendChild(el('button','btn primary','⇄ Koble — ett trykk'));
  const sec=el('div','secondary');sec.innerHTML='<button class="btn quiet">Ikke nå</button><span class="link" style="font-size:14px;color:#5c5c5c">Aldri for Palazzo</span>';act.appendChild(sec);s.appendChild(act);
  s.appendChild(el('div','expander','<span>Hva betyr dette?</span><span class="chev">⌄</span>'));
  return [b,s];
}
const root=document.getElementById('root');
let p;
switch(view){
  case 'tilbud': p=phone();p.appendChild(heroPalazzo());p.appendChild(guestBody());sheetOffer().forEach(x=>p.appendChild(x));break;
  case 'tilbud-forklart': p=phone();p.appendChild(heroPalazzo());p.appendChild(guestBody());sheetOffer({explained:true}).forEach(x=>p.appendChild(x));break;
  case 'venter': p=phone();p.appendChild(heroPalazzo());p.appendChild(guestBody());sheetWaiting().forEach(x=>p.appendChild(x));break;
  case 'koblet': p=phone();p.appendChild(heroPalazzo());p.appendChild(guestBody({linkedCard:true}));break;
  case 'aldri': p=phone();p.appendChild(heroPalazzo());p.appendChild(guestBody({declinedLine:true}));break;
  case 'haven-tilbud': p=phone('haven');p.appendChild(heroHaven());p.appendChild(havenBody());sheetHaven().forEach(x=>p.appendChild(x));break;
  default: p=phone();p.appendChild(el('div','pad','ukjent view'));
}
root.appendChild(p);
</script>
</body></html>
