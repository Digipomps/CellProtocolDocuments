<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" font-family="Inter, system-ui, -apple-system, sans-serif">
<rect width="1120" height="790" fill="#f5f6f1"/>
<text x="40" y="46" font-size="20" fill="#0b0b0c" font-weight="800">Fremhevet lenke på artistflaten</text>
<text x="40" y="70" font-size="13" fill="#60635e">Én knapp øverst. Artisten setter teksten og adressen, og om hvem som helst kan følge den.</text>
<text x="40" y="116" font-size="14" fill="#0b0b0c" font-weight="800">1 · Åpen for alle</text>
<rect x="40" y="128" width="1040" height="86" rx="8" fill="#0b0b0c"/>
<text x="70" y="178" font-size="17" fill="#ffffff" font-weight="900">BUTTERPOP</text>
<text x="718" y="178" font-size="13" fill="#c9cbc4" font-weight="750" text-anchor="end">3 av 5 gratis</text>
<rect x="740" y="149" width="116" height="42" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.3"/>
<text x="797.8" y="176" font-size="13.5" fill="#ffffff" font-weight="800" text-anchor="middle">Bloggen vår</text>
<rect x="865.6" y="149" width="93" height="42" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.3"/>
<text x="912.0" y="176" font-size="13.5" fill="#ffffff" font-weight="800" text-anchor="middle">Logg inn</text>
<text x="40" y="236" font-size="12.5" fill="#60635e">Knappen går rett til adressen. Ingen innlogging, ingen avtale.</text>
<text x="40" y="286" font-size="14" fill="#0b0b0c" font-weight="800">2 · Bak en avtale</text>
<rect x="40" y="298" width="1040" height="86" rx="8" fill="#0b0b0c"/>
<text x="70" y="348" font-size="17" fill="#ffffff" font-weight="900">BUTTERPOP</text>
<text x="718" y="348" font-size="13" fill="#c9cbc4" font-weight="750" text-anchor="end">3 av 5 gratis</text>
<rect x="726" y="319" width="134" height="42" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.3"/>
<text x="801.8" y="346" font-size="13.5" fill="#ffffff" font-weight="800" text-anchor="middle">Bloggen vår</text>
<rect x="740" y="338" width="12" height="9" rx="1.6" fill="#f2cd18"/>
<path d="M 742.5 338 v-3 a 3.5 3.5 0 0 1 7 0 v3" fill="none" stroke="#f2cd18" stroke-width="1.8"/>
<rect x="869.6" y="319" width="93" height="42" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.3"/>
<text x="916.0" y="346" font-size="13.5" fill="#ffffff" font-weight="800" text-anchor="middle">Logg inn</text>
<text x="40" y="406" font-size="12.5" fill="#60635e">Knappen ber om samtykke først. Adressen finnes ikke i sidekilden før avtalen er signert —</text>
<text x="40" y="424" font-size="12.5" fill="#60635e">ellers er porten bare pynt.</text>
<rect x="40" y="456" width="1040" height="246" rx="8" fill="#ffffff" stroke="#c9cbc4" stroke-width="1.5"/>
<text x="68" y="492" font-size="17" fill="#0b0b0c" font-weight="800">Fremhevet lenke</text>
<text x="68" y="514" font-size="12.5" fill="#60635e">I artistens eget område. Tom tekst eller tom adresse fjerner knappen.</text>
<text x="68" y="542" font-size="12" fill="#60635e" font-weight="700">Knappetekst</text>
<rect x="68" y="550" width="430" height="40" rx="6" fill="#f5f6f1" stroke="#c9cbc4" stroke-width="1.2"/>
<text x="82" y="576" font-size="13.5" fill="#0b0b0c" font-weight="600">Bloggen vår</text>
<text x="68" y="608" font-size="12" fill="#60635e" font-weight="700">Adresse</text>
<rect x="68" y="616" width="430" height="40" rx="6" fill="#f5f6f1" stroke="#c9cbc4" stroke-width="1.2"/>
<text x="82" y="642" font-size="13.5" fill="#0b0b0c" font-weight="600">/pub/butterpop/blogg</text>
<text x="68" y="674" font-size="11.5" fill="#60635e">Intern adresse eller full URL. Begge deler går.</text>
<text x="560" y="542" font-size="12" fill="#60635e" font-weight="700">Hvem kan følge den?</text>
<circle cx="569" cy="567" r="9" fill="none" stroke="#2aaeb7" stroke-width="2"/>
<circle cx="569" cy="567" r="4.5" fill="#2aaeb7"/>
<text x="588" y="566" font-size="14" fill="#0b0b0c" font-weight="750">Alle</text>
<text x="588" y="584" font-size="12" fill="#60635e">Knappen går rett dit.</text>
<circle cx="569" cy="619" r="9" fill="none" stroke="#c9cbc4" stroke-width="2"/>
<text x="588" y="618" font-size="14" fill="#0b0b0c" font-weight="750">Bare med avtale</text>
<text x="588" y="636" font-size="12" fill="#60635e">Lytteren må si ja først.</text>
<rect x="40" y="726" width="1040" height="46" rx="8" fill="#ffffff" stroke="#ff634f" stroke-width="1.5"/>
<text x="64" y="746" font-size="12.5" fill="#0b0b0c" font-weight="700">Avtale-varianten krever en samtykkeflate som ikke finnes på musikkflaten i dag.</text>
<text x="64" y="763" font-size="12.5" fill="#60635e">Modellen er skrevet og holder adressen tilbake. Selve samtykkeflaten er ikke bygget — det er et eget stykke arbeid.</text>
</svg>