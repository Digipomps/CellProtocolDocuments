<!doctype html><html lang="nb"><head><meta charset="utf-8"><title>Overta siden din</title><style>:root{--accent:#4a4a46;--ink:#1c1c1a;--muted:#6b6b66;--bg:#fbfaf7;--line:#e6e2d8}
@media (prefers-color-scheme:dark){:root{--ink:#ecebe6;--muted:#a3a29c;--bg:#151514;--line:#2c2c2a}}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Georgia,"Times New Roman",serif}
main{max-width:44rem;margin:0 auto;padding:2.5rem 1.25rem 4rem}
a{color:var(--accent)}h1,h2,h3{line-height:1.2;font-weight:600}h1{font-size:2.1rem;margin:.2rem 0 .6rem}
.masthead{border-bottom:1px solid var(--line);padding-bottom:1.25rem;margin-bottom:1.75rem}.masthead.compact h1{font-size:1.2rem}
.eyebrow{margin:0;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.eyebrow a{text-decoration:none}
.tagline{margin:0;color:var(--muted);font-size:1.05rem}
nav{display:flex;flex-wrap:wrap;gap:.25rem 1rem;margin-top:1rem;font-family:system-ui,sans-serif;font-size:.95rem}
nav a{text-decoration:none;padding:.2rem 0;border-bottom:2px solid transparent}nav a.active{border-bottom-color:var(--accent)}
.about{margin-bottom:2rem}.meta{color:var(--muted);font-size:.9rem;font-family:system-ui,sans-serif;margin:.2rem 0 1rem}
.posts ul,.directory{list-style:none;padding:0;margin:0}.posts li,.directory li{padding:1rem 0;border-top:1px solid var(--line)}
.posts li p{margin:.3rem 0 0}.muted{color:var(--muted)}.kind{color:var(--muted);font-size:.85rem;font-family:system-ui,sans-serif}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));margin:1.5rem 0}
.card{display:flex;flex-direction:column;gap:.5rem;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:.75rem;background:transparent}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px}.card.wide{grid-column:span 2}.card span{color:var(--muted);font-size:.95rem}
article img,figure img{max-width:100%;height:auto;border-radius:4px}figure{margin:1.5rem 0}figcaption{color:var(--muted);font-size:.85rem}
.cover img{width:100%}blockquote{margin:1.25rem 0;padding-left:1rem;border-left:3px solid var(--accent);color:var(--muted)}
pre{overflow-x:auto;padding:.75rem 1rem;background:rgba(127,127,127,.12);border-radius:4px;font-size:.9rem}code{font-family:ui-monospace,Menlo,monospace}
.tags span{display:inline-block;font-family:system-ui,sans-serif;font-size:.8rem;padding:.1rem .5rem;border:1px solid var(--line);border-radius:999px;margin-right:.3rem}
footer{max-width:44rem;margin:0 auto;padding:1rem 1.25rem 3rem;color:var(--muted);font-size:.8rem;font-family:system-ui,sans-serif;border-top:1px solid var(--line)}
.works h2{margin:0 0 .25rem}.exhibition{border-top:1px solid var(--line);padding-top:1.5rem;margin-top:2rem}.exhibition:first-of-type{border-top:0;margin-top:1rem}
.card .title{color:var(--ink);font-size:1rem;font-family:system-ui,sans-serif}.card .noimage{display:block;width:100%;aspect-ratio:4/3;border-radius:4px;background:rgba(127,127,127,.12)}
.note{font-family:system-ui,sans-serif;font-size:.9rem;color:var(--muted);background:rgba(127,127,127,.08);border-radius:6px;padding:.6rem .8rem;margin:.75rem 0 0}
.credits{font-family:system-ui,sans-serif;font-size:.85rem;color:var(--muted);margin:.5rem 0 0}.credits a{color:var(--accent)}</style><style>
.claim{border:1px solid var(--line);border-radius:8px;padding:1.25rem 1.25rem 1rem;margin:1.5rem 0;background:#fff}
.claim dl{display:grid;grid-template-columns:max-content 1fr;gap:.35rem 1rem;margin:1rem 0;font-family:system-ui,sans-serif;font-size:.95rem}
.claim dt{color:var(--muted)}.claim dd{margin:0}
.check{display:flex;gap:.6rem;align-items:flex-start;font-family:system-ui,sans-serif;font-size:.95rem;margin:1.25rem 0}
.check input{width:1.1rem;height:1.1rem;margin-top:.2rem}
.buttons{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1rem}
.btn{font:600 .95rem system-ui,sans-serif;border-radius:6px;padding:.6rem 1rem;border:1px solid var(--ink);background:var(--ink);color:#fff}
.btn.secondary{background:transparent;color:var(--ink);border-color:var(--line)}
.who{font-family:system-ui,sans-serif;font-size:.85rem;color:var(--muted);margin:0}
.done{border-left:4px solid #2f7d5b;background:#eef6f1;border-radius:6px;padding:.8rem 1rem;font-family:system-ui,sans-serif}
</style></head><body><main><header class="masthead compact"><p class="eyebrow">HAVEN</p><p class="who">Innlogget som Sindre Hustveit</p></header><h1>Siden er din nå</h1>
<div class="done">Du har bekreftet rettighetene, og siden og de 14 verkene er flyttet til deg. Merknaden «ikke bekreftet» er borte.</div>
<div class="claim"><dl><dt>Side</dt><dd><a href="#">/pub/sindre-hustveit/verk</a></dd><dt>Endre</dt><dd>Utstillinger og verk finner du i Kunstnersalg og Publisering når du er innlogget.</dd></dl></div>
</main></body></html>
